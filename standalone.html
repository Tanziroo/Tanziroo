:root {
  --bg: #0b0a10;
  --panel: #141220;
  --panel-2: #1c1930;
  --ink: #ece9f5;
  --muted: #9c97b8;
  --accent: #ff2e88;
  --accent-2: #21d4fd;
  --line: #2a2740;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  overflow: hidden;
}

#app { display: grid; grid-template-columns: 360px 1fr; height: 100vh; }

#sidebar {
  background: linear-gradient(180deg, #15121f, #0d0b14);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-height: 0;
}

#sidebar header { padding: 18px 18px 10px; border-bottom: 1px solid var(--line); }
#sidebar h1 {
  margin: 0;
  font-size: 22px;
  letter-spacing: 1px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.sub { margin: 4px 0 0; color: var(--muted); font-size: 12px; }

#panel { padding: 12px 14px; overflow-y: auto; flex: 1; min-height: 0; }
#panel::-webkit-scrollbar { width: 9px; }
#panel::-webkit-scrollbar-thumb { background: #2c2942; border-radius: 6px; }

.presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.preset {
  flex: 1 1 46%;
  padding: 8px 6px; font-size: 12px; cursor: pointer;
  background: var(--panel-2); color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px;
  transition: .15s;
}
.preset:hover { border-color: var(--accent); color: #fff; }

.actions { display: flex; gap: 6px; margin-bottom: 14px; }
.action {
  flex: 1; padding: 8px 4px; font-size: 12px; cursor: pointer;
  background: #211d36; color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px;
}
.action:hover { border-color: var(--accent-2); }

#panel h3 {
  margin: 14px 0 8px; font-size: 12px; text-transform: uppercase;
  letter-spacing: 1.5px; color: var(--muted);
}

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.card {
  position: relative;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 9px 9px 8px; cursor: pointer;
  transition: .15s;
}
.card:hover { transform: translateY(-2px); border-color: #4a4566; }
.card.equipped {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent), 0 6px 18px -8px var(--accent);
  background: #1e1530;
}
.card.equipped::after {
  content: '✓ worn'; position: absolute; top: 7px; right: 8px;
  font-size: 10px; color: var(--accent); letter-spacing: .5px;
}
.card .name { font-size: 13px; font-weight: 600; padding-right: 38px; }
.card .tag {
  display: inline-block; margin-top: 3px; font-size: 10px;
  color: var(--muted); text-transform: uppercase; letter-spacing: 1px;
}

.swatches { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.sw {
  width: 16px; height: 16px; border-radius: 50%; padding: 0; cursor: pointer;
  border: 1px solid #00000055; outline: 2px solid transparent; transition: .1s;
}
.sw:hover { transform: scale(1.18); }
.sw.active { outline: 2px solid var(--accent-2); }

#sidebar footer {
  padding: 10px 16px; border-top: 1px solid var(--line);
  color: var(--muted); font-size: 11px; line-height: 1.5;
}

#stage { position: relative; }
#scene { width: 100%; height: 100%; display: block; }

@media (max-width: 720px) {
  #app { grid-template-columns: 1fr; grid-template-rows: 45vh 55vh; }
  #stage { order: -1; }
}

// Shared body proportions so the avatar and every garment line up.
// Units are roughly meters; feet sit on the ground plane at y = 0.
// A stylized feminine figure, ~1.72 tall.

const P = {
  groundY: 0,

  // Vertical landmarks (world Y)
  ankleY: 0.09,
  kneeY: 0.52,
  hipY: 0.96,
  waistY: 1.07,
  chestY: 1.27,
  shoulderY: 1.44,
  neckY: 1.50,
  chinY: 1.56,
  headY: 1.64,
  topY: 1.74,

  // Horizontal placement
  legX: 0.095, // distance of each leg from the centre line
  shoulderX: 0.175, // distance of each shoulder from the centre line

  // Radii used to fit clothing snugly over the body
  hipR: 0.165,
  waistR: 0.125,
  chestR: 0.155,
  thighR: 0.095,
  calfR: 0.07,
  upperArmR: 0.05,
  foreArmR: 0.042,
  neckR: 0.052,
  headR: 0.10,
};

// The hourglass torso silhouette (radius, y) used by a LatheGeometry.
// Shared so corsets / crop tops can reuse the same curve.
const TORSO_PROFILE = [
  [0.150, P.hipY - 0.02],
  [0.165, P.hipY + 0.02],
  [0.150, P.hipY + 0.06],
  [0.125, P.waistY],
  [0.135, P.waistY + 0.07],
  [0.155, P.chestY - 0.02],
  [0.150, P.chestY + 0.04],
  [0.110, P.shoulderY - 0.04],
  [0.072, P.neckY - 0.02],
  [0.058, P.neckY + 0.02],
];


__exports.P = P;
__exports.TORSO_PROFILE = TORSO_PROFILE;

__defs['materials'] = function(__exports){

// ---- Procedural textures (no external files needed) -------------------------

// A fishnet / mesh pattern drawn to a canvas, tiled. Transparent gaps.
function makeFishnetTexture(color = '#0a0a0a', scale = 16) {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 64, 64);
  ctx.strokeStyle = color;
  ctx.lineWidth = 5;
  // diagonal lattice
  for (let i = -64; i < 128; i += 22) {
    ctx.beginPath();
    ctx.moveTo(i, 0);
    ctx.lineTo(i + 64, 64);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(i + 64, 0);
    ctx.lineTo(i, 64);
    ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(scale, scale * 1.4);
  return tex;
}

// A tartan / plaid pattern for grunge skirts.
function makePlaidTexture(base = '#6e1023', dark = '#2a0710', line = '#d8c08a') {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, 64, 64);
  ctx.fillStyle = dark;
  ctx.globalAlpha = 0.55;
  ctx.fillRect(0, 0, 32, 64);
  ctx.fillRect(0, 0, 64, 32);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = line;
  ctx.lineWidth = 2;
  [10, 22, 42, 54].forEach((p) => {
    ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, 64); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(64, p); ctx.stroke();
  });
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(4, 4);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// ---- Material factory -------------------------------------------------------

// Named finishes used across the catalog so colour swaps stay consistent.
function makeMaterial(color, finish = 'matte') {
  switch (finish) {
    case 'leather': // glossy PU / patent leather
      return new THREE.MeshStandardMaterial({ color, roughness: 0.22, metalness: 0.15 });
    case 'latex':
      return new THREE.MeshStandardMaterial({ color, roughness: 0.08, metalness: 0.2 });
    case 'metal': // studs, chains, buckles
      return new THREE.MeshStandardMaterial({ color, roughness: 0.3, metalness: 1.0 });
    case 'denim':
      return new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0.0 });
    case 'velvet':
      return new THREE.MeshStandardMaterial({ color, roughness: 0.95, metalness: 0.0 });
    case 'mesh': {
      const m = new THREE.MeshStandardMaterial({ color, roughness: 0.7, metalness: 0.0 });
      m.transparent = true;
      m.opacity = 0.55;
      m.side = THREE.DoubleSide;
      return m;
    }
    case 'matte':
    default:
      return new THREE.MeshStandardMaterial({ color, roughness: 0.78, metalness: 0.0 });
  }
}

const SKIN = new THREE.MeshStandardMaterial({ color: 0xe8c4a8, roughness: 0.6, metalness: 0.0 });
const HAIR = new THREE.MeshStandardMaterial({ color: 0x121016, roughness: 0.55, metalness: 0.05 });


__exports.makeFishnetTexture = makeFishnetTexture;
__exports.makePlaidTexture = makePlaidTexture;
__exports.makeMaterial = makeMaterial;
__exports.SKIN = SKIN;
__exports.HAIR = HAIR;
};

__defs['garments'] = function(__exports){
const { P } = __require('proportions');
const { makeMaterial, makeFishnetTexture, makePlaidTexture } = __require('materials');

// Every builder returns a THREE.Group positioned in the avatar's local space.
// Signature: build(color:number, finish:string) => THREE.Group
// `color` is a hex int chosen by the user; `finish` selects the material look.

const DBL = THREE.DoubleSide;
const TWO_PI = Math.PI * 2;

function group(name) { const g = new THREE.Group(); g.name = name; return g; }
function shadow(m) { m.castShadow = true; m.receiveShadow = true; return m; }

// shell with an opening at the front (+Z), used for jackets / coats / corsets
function openShell(rTop, rBot, h, yCenter, mat, gap = 0) {
  const theta0 = Math.PI / 2 + gap / 2;
  const thetaLen = TWO_PI - gap;
  const geo = new THREE.CylinderGeometry(rTop, rBot, h, 28, 1, true, theta0, thetaLen);
  const m = shadow(new THREE.Mesh(geo, mat));
  m.position.y = yCenter;
  return m;
}

// a tube that follows one leg (thigh + calf), slightly larger than the skin
function legTube(side, mat, opts = {}) {
  const g = group('legtube');
  const rT = (opts.thigh ?? P.thighR) + (opts.pad ?? 0.012);
  const rC = (opts.calf ?? P.calfR) + (opts.pad ?? 0.012);
  const topY = opts.topY ?? P.hipY - 0.02;
  const botY = opts.botY ?? P.ankleY + 0.02;
  const kneeY = P.kneeY;
  const thigh = shadow(new THREE.Mesh(new THREE.CylinderGeometry(rC + 0.01, rT, topY - kneeY, 16, 1, true), mat));
  thigh.position.set(side * P.legX, (topY + kneeY) / 2, 0);
  const calf = shadow(new THREE.Mesh(new THREE.CylinderGeometry(rC - 0.005, rC + 0.01, kneeY - botY, 16, 1, true), mat));
  calf.position.set(side * P.legX, (kneeY + botY) / 2, 0);
  g.add(thigh, calf);
  return g;
}

// ---------------------------------------------------------------------------
// TOPS
// ---------------------------------------------------------------------------

function cropTop(color, finish = 'matte') {
  const g = group('cropTop');
  const mat = makeMaterial(color, finish); mat.side = DBL;
  const pts = [
    new THREE.Vector2(0.140, P.chestY - 0.10),
    new THREE.Vector2(0.165, P.chestY - 0.02),
    new THREE.Vector2(0.162, P.chestY + 0.04),
    new THREE.Vector2(0.120, P.shoulderY - 0.06),
    new THREE.Vector2(0.090, P.shoulderY - 0.02),
  ];
  g.add(shadow(new THREE.Mesh(new THREE.LatheGeometry(pts, 28), mat)));
  // straps
  [-1, 1].forEach((s) => {
    const strap = shadow(new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.16, 0.02), mat));
    strap.position.set(s * 0.07, P.shoulderY - 0.02, 0.02);
    g.add(strap);
  });
  return g;
}

function corset(color, finish = 'leather') {
  const g = group('corset');
  const mat = makeMaterial(color, finish); mat.side = DBL;
  const pts = [
    new THREE.Vector2(0.170, P.hipY + 0.00),
    new THREE.Vector2(0.150, P.hipY + 0.06),
    new THREE.Vector2(0.130, P.waistY),
    new THREE.Vector2(0.142, P.waistY + 0.08),
    new THREE.Vector2(0.162, P.chestY - 0.02),
    new THREE.Vector2(0.150, P.chestY + 0.05),
  ];
  g.add(shadow(new THREE.Mesh(new THREE.LatheGeometry(pts, 28), mat)));
  // lacing across the front
  const lace = makeMaterial(0xdddddd, 'matte');
  for (let i = 0; i < 7; i++) {
    const y = P.waistY - 0.04 + i * 0.045;
    const x = i % 2 ? 0.02 : -0.02;
    const l = shadow(new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.004, 0.06, 6), lace));
    l.rotation.z = Math.PI / 2 + (i % 2 ? 0.5 : -0.5);
    l.position.set(x, y, 0.16);
    g.add(l);
  }
  // vertical boning seams
  const bone = new THREE.MeshStandardMaterial({ color: new THREE.Color(color).multiplyScalar(0.45), roughness: 0.3, metalness: 0.1 });
  for (let k = -2; k <= 2; k++) {
    if (k === 0) continue;
    const ang = k * 0.34, r = 0.150;
    const bn = shadow(new THREE.Mesh(new THREE.BoxGeometry(0.011, 0.27, 0.015), bone));
    bn.position.set(Math.sin(ang) * r, P.waistY + 0.045, Math.cos(ang) * r);
    bn.rotation.y = ang;
    g.add(bn);
  }
  return g;
}

function meshTop(color, finish = 'mesh') {
  const g = group('meshTop');
  const mat = makeMaterial(color, 'mesh');
  const pts = [
    new THREE.Vector2(0.158, P.waistY - 0.02),
    new THREE.Vector2(0.135, P.waistY + 0.04),
    new THREE.Vector2(0.160, P.chestY),
    new THREE.Vector2(0.118, P.shoulderY - 0.03),
    new THREE.Vector2(0.072, P.neckY),
  ];
  g.add(shadow(new THREE.Mesh(new THREE.LatheGeometry(pts, 28), mat)));
  // long sleeves over arms
  [-1, 1].forEach((s) => {
    const sl = shadow(new THREE.Mesh(new THREE.CapsuleGeometry(P.upperArmR + 0.015, 0.5, 6, 12), mat));
    sl.position.set(s * (P.shoulderX + 0.06), P.shoulderY - 0.30, 0);
    sl.rotation.z = s * 0.12;
    g.add(sl);
  });
  return g;
}

function bandTee(color, finish = 'matte') {
  const g = group('bandTee');
  const mat = makeMaterial(color, finish); mat.side = DBL;
  const pts = [
    new THREE.Vector2(0.150, P.hipY + 0.04),
    new THREE.Vector2(0.140, P.waistY),
    new THREE.Vector2(0.160, P.chestY),
    new THREE.Vector2(0.115, P.shoulderY - 0.03),
    new THREE.Vector2(0.085, P.shoulderY + 0.01),
  ];
  g.add(shadow(new THREE.Mesh(new THREE.LatheGeometry(pts, 28), mat)));
  // short sleeves
  [-1, 1].forEach((s) => {
    const sl = shadow(new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.058, 0.12, 12, 1, true), mat));
    sl.position.set(s * (P.shoulderX + 0.02), P.shoulderY - 0.10, 0);
    sl.rotation.z = s * 0.5;
    g.add(sl);
  });
  // a little band-logo plate on the chest
  const logo = shadow(new THREE.Mesh(new THREE.PlaneGeometry(0.12, 0.12), makeMaterial(0xf2f2f2, 'matte')));
  logo.position.set(0, P.chestY, 0.158);
  g.add(logo);
  return g;
}

// ---------------------------------------------------------------------------
// OUTERWEAR
// ---------------------------------------------------------------------------

function leatherJacket(color, finish = 'leather') {
  const g = group('leatherJacket');
  const mat = makeMaterial(color, finish); mat.side = DBL;
  // open body shell, cropped at the waist
  g.add(openShell(0.165, 0.175, P.shoulderY - P.waistY + 0.05, (P.shoulderY + P.waistY) / 2, mat, 1.0));
  // popped collar (open at front)
  const collar = openShell(0.105, 0.085, 0.09, P.neckY + 0.0, mat, 1.0);
  collar.scale.set(1.05, 1, 1.05);
  g.add(collar);
  // sleeves
  [-1, 1].forEach((s) => {
    const up = shadow(new THREE.Mesh(new THREE.CapsuleGeometry(P.upperArmR + 0.02, 0.26, 6, 12), mat));
    up.position.set(s * (P.shoulderX + 0.03), P.shoulderY - 0.16, 0);
    up.rotation.z = s * 0.14;
    const lo = shadow(new THREE.Mesh(new THREE.CapsuleGeometry(P.foreArmR + 0.018, 0.24, 6, 12), mat));
    lo.position.set(s * (P.shoulderX + 0.085), P.shoulderY - 0.44, 0);
    lo.rotation.z = s * 0.10;
    g.add(up, lo);
  });
  // zipper + studs accents
  const metal = makeMaterial(0xc9ccd1, 'metal');
  for (let i = 0; i < 5; i++) {
    const stud = shadow(new THREE.Mesh(new THREE.SphereGeometry(0.012, 8, 8), metal));
    stud.position.set(-0.10, P.shoulderY - 0.10 - i * 0.02, 0.16);
    g.add(stud);
  }
  // peaked lapels + cuffs
  [-1, 1].forEach((s) => {
    const lap = shadow(new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.24, 0.02), mat));
    lap.position.set(s * 0.075, P.chestY + 0.03, 0.135);
    lap.rotation.z = s * 0.32; lap.rotation.y = -s * 0.30;
    const cf = shadow(new THREE.Mesh(new THREE.TorusGeometry(P.foreArmR + 0.022, 0.013, 8, 18), mat));
    cf.position.set(s * (P.shoulderX + 0.095), P.shoulderY - 0.555, 0);
    cf.rotation.y = Math.PI / 2;
    g.add(lap, cf);
  });
  // asymmetric moto zipper: offset flap edge + metal zip line + pull tab
  const midY = (P.shoulderY + P.waistY) / 2;
  const zlen = P.shoulderY - P.waistY + 0.02;
  const flap = shadow(new THREE.Mesh(new THREE.BoxGeometry(0.05, zlen, 0.014), mat));
  flap.position.set(0.035, midY, 0.152); flap.rotation.z = 0.06;
  const zip = shadow(new THREE.Mesh(new THREE.BoxGeometry(0.012, zlen, 0.012), metal));
  zip.position.set(-0.005, midY, 0.158); zip.rotation.z = 0.06;
  const pull = shadow(new THREE.Mesh(new THREE.BoxGeometry(0.013, 0.03, 0.01), metal));
  pull.position.set(-0.01, P.waistY + 0.10, 0.163);
  g.add(flap, zip, pull);
  return g;
}

function harness(color, finish = 'leather') {
  const g = group('harness');
  const mat = makeMaterial(color, finish);
  const metal = makeMaterial(0xc9ccd1, 'metal');
  const strap = (w, h, d) => shadow(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat));
  // under-bust band
  const band = shadow(new THREE.Mesh(new THREE.TorusGeometry(0.155, 0.012, 8, 28), mat));
  band.rotation.x = Math.PI / 2;
  band.position.y = P.chestY - 0.06;
  band.scale.set(1, 0.85, 1);
  g.add(band);
  // O-ring at sternum
  const ring = shadow(new THREE.Mesh(new THREE.TorusGeometry(0.03, 0.008, 8, 18), metal));
  ring.position.set(0, P.chestY, 0.15);
  g.add(ring);
  // vertical + diagonal straps
  [-1, 1].forEach((s) => {
    const v = strap(0.022, 0.18, 0.02);
    v.position.set(s * 0.05, P.chestY + 0.06, 0.14);
    g.add(v);
    const d = strap(0.022, 0.20, 0.02);
    d.position.set(s * 0.10, P.chestY - 0.02, 0.12);
    d.rotation.z = s * 0.5;
    g.add(d);
  });
  // neck loop
  const loop = shadow(new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.011, 8, 24), mat));
  loop.rotation.x = Math.PI / 2;
  loop.position.set(0, P.neckY + 0.02, 0.0);
  loop.scale.set(1, 1, 0.7);
  g.add(loop);
  // waist O-ring band + connector rings at strap junctions
  const wband = shadow(new THREE.Mesh(new THREE.TorusGeometry(0.150, 0.011, 8, 28), mat));
  wband.rotation.x = Math.PI / 2; wband.position.y = P.waistY + 0.02; wband.scale.set(1, 0.88, 1);
  g.add(wband);
  [[0, P.chestY + 0.06], [0, P.chestY - 0.10]].forEach(([px, py]) => {
    const or = shadow(new THREE.Mesh(new THREE.TorusGeometry(0.018, 0.006, 8, 16), metal));
    or.position.set(px, py, 0.145);
    g.add(or);
  });
  [-1, 1].forEach((s) => {
    const sr = shadow(new THREE.Mesh(new THREE.TorusGeometry(0.013, 0.005, 8, 14), metal));
    sr.position.set(s * 0.10, P.waistY + 0.02, 0.135); sr.rotation.y = Math.PI / 2;
    const connect = shadow(new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.13, 0.018), mat));
    connect.position.set(s * 0.085, P.chestY - 0.10, 0.135);
    g.add(sr, connect);
  });
  return g;
}

function trenchCoat(color, finish = 'leather') {
  const g = group('trenchCoat');
  const mat = makeMaterial(color, finish); mat.side = DBL;
  // long open body from shoulders to knees, flaring out
  const pts = [
    new THREE.Vector2(0.20, P.kneeY - 0.02),
    new THREE.Vector2(0.185, P.hipY),
    new THREE.Vector2(0.165, P.waistY + 0.02),
    new THREE.Vector2(0.180, P.chestY),

function pleatedSkirt(color, finish = 'matte', plaid = true) {

    : (() => { const m = makeMaterial(color, finish); m.side = DBL; return m; })();
  mat.flatShading = true;
  const topY = P.hipY - 0.02;

  const geo = new THREE.CylinderGeometry(0.155, 0.235, topY - hemY, N, 1, true);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const ang = Math.atan2(z, x);
    const seg = Math.round((ang / (Math.PI * 2)) * N);
    const r = Math.sqrt(x * x + z * z) * ((seg % 2) ? 0.86 : 1.0);
    pos.setX(i, Math.cos(ang) * r);
    pos.setZ(i, Math.sin(ang) * r);
  }
  geo.computeVertexNormals();
  const skirt = shadow(new THREE.Mesh(geo, mat));
  skirt.position.y = (topY + hemY) / 2;

__defs['wardrobe'] = function(__exports){
const { ITEMS, SLOTS } = __require('catalog');

// Owns the equip state and the live garment meshes attached to the avatar.
class Wardrobe {
  constructor(avatarGroup) {
    this.avatar = avatarGroup;
    this.byId = Object.fromEntries(ITEMS.map((i) => [i.id, i]));
    // slotId -> equipped item id(s). Single slots hold a string|null, multi hold a Set.
    this.equipped = {};
    // itemId -> { group, color } for currently mounted meshes
    this.mounted = {};
    // itemId -> chosen color (persists across re-equips)
    this.colors = Object.fromEntries(ITEMS.map((i) => [i.id, i.color]));
    SLOTS.forEach((s) => { this.equipped[s.id] = s.multi ? new Set() : null; });
  }

  isEquipped(itemId) {
    const item = this.byId[itemId];
    const slot = SLOTS.find((s) => s.id === item.slot);
    return slot.multi ? this.equipped[item.slot].has(itemId) : this.equipped[item.slot] === itemId;
  }

  _mount(itemId) {
    const item = this.byId[itemId];
    const grp = item.build(this.colors[itemId], item.finish);
    grp.userData.itemId = itemId;
    this.avatar.add(grp);
    this.mounted[itemId] = grp;
  }

  _unmount(itemId) {
    const grp = this.mounted[itemId];
    if (!grp) return;
    this.avatar.remove(grp);
    grp.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach((m) => { if (m.map) m.map.dispose(); m.dispose(); });
      }
    });
    delete this.mounted[itemId];
  }

  // Toggle an item on/off. Returns the resulting equipped state (bool).
  toggle(itemId) {
    const item = this.byId[itemId];
    const slot = SLOTS.find((s) => s.id === item.slot);
    if (slot.multi) {
      const set = this.equipped[item.slot];
      if (set.has(itemId)) { set.delete(itemId); this._unmount(itemId); return false; }
      set.add(itemId); this._mount(itemId); return true;
    }
    const current = this.equipped[item.slot];
    if (current === itemId) { this.equipped[item.slot] = null; this._unmount(itemId); return false; }
    if (current) this._unmount(current);
    this.equipped[item.slot] = itemId;
    this._mount(itemId);
    return true;
  }

  equip(itemId) { if (!this.isEquipped(itemId)) this.toggle(itemId); }
  unequip(itemId) { if (this.isEquipped(itemId)) this.toggle(itemId); }

  setColor(itemId, hex) {
    this.colors[itemId] = hex;
    if (this.mounted[itemId]) { // re-mount with new colour
      this._unmount(itemId);
      this._mount(itemId);
    }
  }

  clearAll() {
    Object.keys(this.mounted).forEach((id) => this._unmount(id));
    SLOTS.forEach((s) => { this.equipped[s.id] = s.multi ? new Set() : null; });
  }

  applyPreset(preset) {
    this.clearAll();
    for (const [slotId, val] of Object.entries(preset.items)) {
      if (!val) continue;
      const ids = Array.isArray(val) ? val : [val];
      ids.forEach((id) => {
        if (preset.colors && preset.colors[id] != null) this.colors[id] = preset.colors[id];
        this.equip(id);
      });
    }
  }
}


__exports.Wardrobe = Wardrobe;
};

__defs['ui'] = function(__exports){
const { ITEMS, SLOTS, PALETTE, PRESETS } = __require('catalog');

const hex = (n) => '#' + n.toString(16).padStart(6, '0');

// Builds the wardrobe panel and wires it to the Wardrobe instance.
function buildUI(wardrobe, { onShuffle, onTurntable } = {}) {
  const panel = document.getElementById('panel');

  // --- Presets row ---
  const presetWrap = document.createElement('div');
  presetWrap.className = 'presets';
  PRESETS.forEach((p) => {
    const b = document.createElement('button');
    b.className = 'preset';
    b.textContent = p.name;
    b.onclick = () => { wardrobe.applyPreset(p); refresh(); };
    presetWrap.appendChild(b);
  });
  panel.appendChild(presetWrap);

  // --- Action row ---
  const actions = document.createElement('div');
  actions.className = 'actions';
  const mk = (label, fn) => { const b = document.createElement('button'); b.className = 'action'; b.textContent = label; b.onclick = fn; return b; };
  actions.appendChild(mk('🎲 Shuffle', () => { onShuffle?.(); refresh(); }));
  actions.appendChild(mk('🧹 Clear', () => { wardrobe.clearAll(); refresh(); }));
  const ttBtn = mk('🔄 Turntable: On', function () {
    const on = onTurntable?.();
    this.textContent = '🔄 Turntable: ' + (on ? 'On' : 'Off');
  });
  actions.appendChild(ttBtn);
  panel.appendChild(actions);

  // --- Slot groups (the "swarm" of clothing) ---
  const cards = {}; // itemId -> { el, swatches }
  SLOTS.forEach((slot) => {
    const section = document.createElement('section');
    const h = document.createElement('h3');
    h.textContent = slot.label + (slot.multi ? '  (stackable)' : '');
    section.appendChild(h);

    const grid = document.createElement('div');
    grid.className = 'grid';
    ITEMS.filter((i) => i.slot === slot.id).forEach((item) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = item.id;

      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = item.name;

      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = item.tag;

      const swatches = document.createElement('div');
      swatches.className = 'swatches';
      PALETTE.forEach((c) => {
        const sw = document.createElement('button');
        sw.className = 'sw';
        sw.style.background = hex(c.hex);
        sw.title = c.name;
        sw.onclick = (e) => { e.stopPropagation(); wardrobe.setColor(item.id, c.hex); markColor(item.id, c.hex); };
        swatches.appendChild(sw);
      });

      card.appendChild(name);
      card.appendChild(tag);
      card.appendChild(swatches);
      card.onclick = () => { wardrobe.toggle(item.id); refresh(); };

      grid.appendChild(card);
      cards[item.id] = { el: card, swatches };
    });

    section.appendChild(grid);
    panel.appendChild(section);
  });

  function markColor(itemId, h) {
    const { swatches } = cards[itemId];
    [...swatches.children].forEach((sw, idx) => {
      sw.classList.toggle('active', PALETTE[idx].hex === h);
    });
  }

  function refresh() {
    ITEMS.forEach((item) => {
      const on = wardrobe.isEquipped(item.id);
      cards[item.id].el.classList.toggle('equipped', on);
      markColor(item.id, wardrobe.colors[item.id]);
    });
    updateCount();
  }

  const count = document.getElementById('count');
  function updateCount() {
    const n = Object.keys(wardrobe.mounted).length;
    count.textContent = `${ITEMS.length} pieces · ${n} worn`;
  }

  refresh();
  return { refresh };
}


__exports.buildUI = buildUI;

// ---- entry ----
const { buildAvatar } = __require('avatar');
const { Wardrobe } = __require('wardrobe');
const { buildUI } = __require('ui');
const { ITEMS, SLOTS } = __require('catalog');

// ---- Renderer / scene / camera ---------------------------------------------
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0a10);
scene.fog = new THREE.Fog(0x0b0a10, 4.5, 10);

// Environment map so glossy goth materials have something to reflect.
function buildEnv() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 256;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#4a4566'); g.addColorStop(0.55, '#1a1726'); g.addColorStop(1, '#070710');
  x.fillStyle = g; x.fillRect(0, 0, 512, 256);
  x.globalAlpha = 0.55;
  x.fillStyle = '#ff2e88'; x.beginPath(); x.arc(120, 140, 70, 0, 7); x.fill();
  x.fillStyle = '#21d4fd'; x.beginPath(); x.arc(400, 110, 70, 0, 7); x.fill();
  x.globalAlpha = 1;
  const t = new THREE.CanvasTexture(c);
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromEquirectangular(buildEnv()).texture;

const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
camera.position.set(0, 1.2, 3.0);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true;
controls.minDistance = 1.3;
controls.maxDistance = 6;
controls.maxPolarAngle = Math.PI * 0.92;

// ---- Lighting: dark studio with magenta / cyan rim lights ------------------
scene.add(new THREE.HemisphereLight(0xbfb9e0, 0x16121f, 0.9));

const key = new THREE.SpotLight(0xffffff, 90, 20, Math.PI / 5, 0.4, 1.5);
key.position.set(2.5, 4.5, 3.2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0004;
scene.add(key, key.target);

const rimMagenta = new THREE.PointLight(0xff2e88, 55, 14, 2);
rimMagenta.position.set(-2.6, 1.7, -1.4);
scene.add(rimMagenta);

const rimCyan = new THREE.PointLight(0x21d4fd, 48, 14, 2);
rimCyan.position.set(2.5, 1.5, -1.9);
scene.add(rimCyan);

const fill = new THREE.DirectionalLight(0xb9beff, 0.7);
fill.position.set(-1.5, 2, 2.5);
scene.add(fill);

// ---- Floor (reflective-looking disc + grid) --------------------------------
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(2.2, 64),
  new THREE.MeshStandardMaterial({ color: 0x111018, roughness: 0.35, metalness: 0.6 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const grid = new THREE.PolarGridHelper(2.2, 16, 6, 64, 0x3a3550, 0x201d30);
grid.position.y = 0.001;
scene.add(grid);

// ---- Avatar + wardrobe ------------------------------------------------------
const avatar = buildAvatar();
scene.add(avatar);

const wardrobe = new Wardrobe(avatar);

// ---- UI hooks ---------------------------------------------------------------
let turntable = true;

function shuffle() {
  wardrobe.clearAll();
  SLOTS.forEach((slot) => {
    const pool = ITEMS.filter((i) => i.slot === slot.id);
    if (slot.multi) {
      pool.forEach((i) => { if (Math.random() < 0.4) pick(i); });
    } else if (Math.random() < 0.85) {
      pick(pool[Math.floor(Math.random() * pool.length)]);
    }
  });
  function pick(item) {
    // random colour from the catalog palette occasionally
    wardrobe.equip(item.id);
  }
}

buildUI(wardrobe, {
  onShuffle: shuffle,
  onTurntable: () => { turntable = !turntable; return turntable; },
});

// Start on a vivid, textured look so colour + texture read immediately.
{
  Object.assign(wardrobe.colors, { corset: 0xc01f7b, platform: 0x5b2a86, choker: 0xff9ec7, ears: 0x2a1430 });
  ['corset', 'plaid', 'stripe', 'platform', 'choker', 'ears'].forEach((id) => wardrobe.equip(id));
  // reflect initial state in the UI
  document.querySelectorAll('.card').forEach((c) => {
    c.classList.toggle('equipped', wardrobe.isEquipped(c.dataset.id));
  });
  document.getElementById('count').textContent =
    `${ITEMS.length} pieces · ${Object.keys(wardrobe.mounted).length} worn`;
}

// ---- Resize + render loop ---------------------------------------------------
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w || canvas.height !== h) {
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
}

const clock = new THREE.Clock();
function tick() {
  const dt = clock.getDelta();
  if (turntable) avatar.rotation.y += dt * 0.35;
  resize();
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();


</script>
