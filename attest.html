<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>ATTEST · family-safe shared world + item transfer</title>
<style>
:root{--bg:#0b0a10;--panel:#141220;--ink:#ece9f5;--muted:#9c97b8;--accent:#ff2e88;--accent-2:#21d4fd;--ok:#37d67a;--bad:#ff6b6b;--warn:#f5c451;--line:#2a2740;}
*{box-sizing:border-box;} html,body{margin:0;height:100%;}
body{background:var(--bg);color:var(--ink);font-family:'SFMono-Regular',Consolas,'Roboto Mono',monospace;overflow:hidden;-webkit-tap-highlight-color:transparent;}
#app{display:grid;grid-template-columns:1fr 372px;height:100vh;height:100dvh;}
#stage{position:relative;background:#08070d;} #view{width:100%;height:100%;display:block;touch-action:none;}
#pov{position:absolute;top:10px;left:10px;z-index:4;background:#141220dd;border:1px solid var(--line);border-radius:9px;padding:8px 10px;backdrop-filter:blur(6px);}
#pov .t{font-size:9px;letter-spacing:2px;color:var(--muted);}
#pov .who{font-size:15px;font-weight:700;} #pov .age{font-size:10px;color:var(--accent-2);}
#note{position:absolute;bottom:10px;left:10px;right:10px;z-index:4;font-size:11px;line-height:1.45;background:#141220dd;border:1px solid var(--line);border-radius:9px;padding:8px 11px;backdrop-filter:blur(6px);}
#side{background:linear-gradient(180deg,#15121f,#0d0b14);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;}
#side h1{margin:0;padding:12px 14px 3px;font-size:15px;letter-spacing:1px;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;}
#side .sub{padding:0 14px 8px;font-size:10px;color:var(--muted);border-bottom:1px solid var(--line);}
#scroll{overflow-y:auto;flex:1;min-height:0;padding:10px 12px;}
.rowlbl{font-size:9.5px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);margin:13px 2px 6px;} .rowlbl:first-child{margin-top:0;}
.accts{display:flex;gap:7px;} .acct{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px;cursor:pointer;text-align:center;}
.acct.on{border-color:var(--accent);background:#1e1530;} .acct .n{font-size:13px;font-weight:700;} .acct .a{font-size:10px;color:var(--muted);} .acct .tier{font-size:9px;margin-top:3px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:11px;line-height:1.7;}
.att{display:flex;justify-content:space-between;} .att .v{color:var(--ok);}
.item{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-bottom:6px;font-size:11px;gap:8px;}
.item .nm{font-weight:600;} .item .meta{font-size:9.5px;color:var(--muted);}
.rt{font-size:9px;padding:1px 6px;border-radius:4px;border:1px solid;} .rt.E{color:var(--ok);border-color:var(--ok);} .rt.T{color:var(--warn);border-color:var(--warn);} .rt.M{color:var(--bad);border-color:var(--bad);}
.gift{background:#211d36;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;font-size:10px;cursor:pointer;white-space:nowrap;} .gift:hover{border-color:var(--accent-2);}
#ledger{font-size:10px;color:var(--muted);line-height:1.7;} #ledger .a{color:var(--accent-2);} #ledger .s{color:var(--ok);}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0a10;color:#9c97b8;z-index:50;}
@media (max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:42vh 1fr;}#stage{order:-1;}}
</style>
</head>
<body>
<script>
/* fail loud, never silent — surface any error instead of leaving a dead page */
function showFatal(e){var d=document.getElementById('__fatal');if(!d){d=document.createElement('div');d.id='__fatal';document.body.appendChild(d);}d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#2a0d16;color:#ff9ec7;border-top:1px solid #ff6b6b;padding:10px 14px;font:12px/1.5 monospace;white-space:pre-wrap';d.textContent='\u26a0 error: '+((e&&e.message)||e)+'  \u2014 page may be partly broken; send this line to Ryan';}
window.addEventListener('error',function(ev){showFatal(ev.error||ev.message);});
window.addEventListener('unhandledrejection',function(ev){showFatal(ev.reason);});
</script>
<div id="app">
  <div id="stage"><canvas id="view"></canvas>
    <div id="pov"><div class="t">VIEWING AS</div><div class="who" id="povWho">—</div><div class="age" id="povAge"></div></div>
    <div id="note"></div>
  </div>
  <aside id="side">
    <h1>⛧ ATTEST</h1><div class="sub">family-safe shared world · attested item transfer</div>
    <div id="scroll">
      <div class="rowlbl">The Vance family — pick who's looking</div>
      <div class="accts" id="accts"></div>
      <div class="rowlbl">Attested credentials (signed)</div>
      <div class="card" id="attCard"></div>
      <div class="rowlbl">What this viewer sees on the shared avatar</div>
      <div id="loadout"></div>
      <div class="rowlbl">Inventory &amp; ownership — free transfer within family</div>
      <div id="inv"></div>
      <div class="rowlbl">Attested transfer ledger</div>
      <div id="ledger"></div>
    </div>
  </aside>
</div>
<div id="boot">loading attestation demo…</div>

<script>
(function(){function ls(u,d){var i=0;(function n(){if(i>=u.length){d(new Error('cdn'));return;}var s=document.createElement('script');s.src=u[i++];s.onload=function(){d(null);};s.onerror=n;document.head.appendChild(s);})();}
  ls(['https://unpkg.com/three@0.147.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/0.147.0/three.min.js'],function(e){
    if(e||!window.THREE){document.getElementById('boot').textContent='couldn\'t load three.';return;}
    ls(['https://unpkg.com/three@0.147.0/examples/js/controls/OrbitControls.js','https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js'],function(){var b=document.getElementById('boot');if(b)b.remove();try{start();}catch(err){showFatal(err);}});
  });})();

function start(){
"use strict";
if(typeof THREE.OrbitControls!=='function'){THREE.OrbitControls=function(c){this.target=new THREE.Vector3();this.update=function(){};};}
var P={ankleY:0.09,kneeY:0.52,hipY:0.96,waistY:1.07,chestY:1.27,shoulderY:1.44,neckY:1.50,headY:1.64,topY:1.74,legX:0.095,shoulderX:0.175,thighR:0.095,calfR:0.07,neckR:0.052,headR:0.10};
var SKIN=new THREE.MeshStandardMaterial({color:0xe8c4a8,roughness:0.6}),HAIR=new THREE.MeshStandardMaterial({color:0x121016,roughness:0.55,metalness:0.05}),METAL=new THREE.MeshStandardMaterial({color:0xc9ccd1,roughness:0.3,metalness:1});
function S(m){m.castShadow=true;m.receiveShadow=true;return m;}
function em(c,i){return new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:i==null?0.6:i,roughness:0.35,metalness:0.4,side:THREE.DoubleSide});}
function soft(c){return new THREE.MeshStandardMaterial({color:c,roughness:0.85,side:THREE.DoubleSide});}
function lathe(pts,m,seg){return S(new THREE.Mesh(new THREE.LatheGeometry(pts.map(function(p){return new THREE.Vector2(p[0],p[1]);}),seg||32),m));}

var canvas=document.getElementById('view');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));renderer.physicallyCorrectLights=true;renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
var scene=new THREE.Scene();scene.background=new THREE.Color(0x0b0a10);scene.fog=new THREE.Fog(0x0b0a10,3.5,10);
var camera=new THREE.PerspectiveCamera(40,1,0.1,100);camera.position.set(0.4,1.15,2.7);
var controls=new THREE.OrbitControls(camera,canvas);controls.target.set(0,1.0,0);controls.enableDamping=true;controls.autoRotate=true;controls.autoRotateSpeed=0.6;controls.minDistance=1.4;controls.maxDistance=5;controls.maxPolarAngle=Math.PI*0.9;
scene.add(new THREE.HemisphereLight(0xbfb9e0,0x16121f,0.8));
var key=new THREE.SpotLight(0xffffff,70,20,Math.PI/5,0.4,1.5);key.position.set(2.5,4.5,3.2);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.bias=-0.0004;scene.add(key,key.target);
scene.add(Object.assign(new THREE.PointLight(0xff2e88,32,12,2),{position:new THREE.Vector3(-2.4,1.6,-1.3)}));
scene.add(Object.assign(new THREE.PointLight(0x21d4fd,28,12,2),{position:new THREE.Vector3(2.4,1.5,-1.7)}));
var floor=new THREE.Mesh(new THREE.CircleGeometry(3,48),new THREE.MeshStandardMaterial({color:0x111018,roughness:0.4,metalness:0.5}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
var body=new THREE.Group();(function(){
  body.add(lathe([[0.155,P.hipY-0.04],[0.168,P.hipY+0.02],[0.150,P.hipY+0.07],[0.122,P.waistY],[0.135,P.waistY+0.08],[0.156,P.chestY-0.02],[0.150,P.chestY+0.05],[0.105,P.shoulderY-0.03],[0.070,P.neckY-0.02],[0.056,P.neckY+0.02]],SKIN,44));
  var pel=S(new THREE.Mesh(new THREE.SphereGeometry(0.155,26,18),SKIN));pel.position.set(0,P.hipY-0.05,0);pel.scale.set(1,0.7,0.85);body.add(pel);
  var neck=S(new THREE.Mesh(new THREE.CylinderGeometry(P.neckR,P.neckR+0.01,0.09,16),SKIN));neck.position.set(0,P.neckY+0.05,0);body.add(neck);
  var head=S(new THREE.Mesh(new THREE.SphereGeometry(P.headR,32,24),SKIN));head.position.set(0,P.headY,0);head.scale.set(0.92,1.08,0.95);body.add(head);
  var hb=S(new THREE.Mesh(new THREE.SphereGeometry(P.headR+0.02,24,18),HAIR));hb.position.set(0,P.headY+0.01,-0.01);hb.scale.set(1.05,1.18,1.05);body.add(hb);
  [-1,1].forEach(function(s){var th=S(new THREE.Mesh(new THREE.CapsuleGeometry(P.thighR,0.34,10,16),SKIN));th.position.set(s*P.legX,(P.hipY+P.kneeY)/2+0.02,0);body.add(th);var ca=S(new THREE.Mesh(new THREE.CapsuleGeometry(P.calfR,0.32,10,16),SKIN));ca.position.set(s*P.legX,(P.kneeY+P.ankleY)/2+0.02,0);body.add(ca);
    var up=S(new THREE.Mesh(new THREE.CapsuleGeometry(0.045,0.26,10,16),SKIN));up.position.set(s*(P.shoulderX+0.02),P.shoulderY-0.16,0);up.rotation.z=s*0.15;body.add(up);var fo=S(new THREE.Mesh(new THREE.CapsuleGeometry(0.037,0.24,10,16),SKIN));fo.position.set(s*(P.shoulderX+0.075),P.shoulderY-0.44,0);fo.rotation.z=s*0.1;body.add(fo);});
})();scene.add(body);

/* items: real build (mature look) + a family-safe fallback build */
function bReal(id){var g=new THREE.Group();
  if(id==='circlet'){var h=S(new THREE.Mesh(new THREE.TorusGeometry(P.headR+0.01,0.012,8,24),em(0x9fd0ff,0.5)));h.rotation.x=Math.PI/2;h.position.y=P.headY+0.06;g.add(h);}
  else if(id==='cloak'){g.add(lathe([[0.10,P.shoulderY],[0.20,P.hipY],[0.30,P.kneeY+0.1],[0.36,P.kneeY-0.2]],soft(0x2a2450),40));g.children[0].position.z=-0.08;g.children[0].scale.set(1,1,0.6);}
  else if(id==='pauldron'){[-1,1].forEach(function(s){var p=S(new THREE.Mesh(new THREE.SphereGeometry(0.075,12,10),new THREE.MeshStandardMaterial({color:0x3a3550,roughness:0.4,metalness:0.7})));p.position.set(s*(P.shoulderX+0.02),P.shoulderY,0);p.scale.set(1,0.7,1);g.add(p);for(var i=0;i<3;i++){var sp=S(new THREE.Mesh(new THREE.ConeGeometry(0.015,0.05,6),METAL));sp.position.set(s*(P.shoulderX+0.02),P.shoulderY+0.06,-0.04+i*0.04);g.add(sp);}});}
  else if(id==='mantle'){g.add(lathe([[0.11,P.shoulderY+0.02],[0.19,P.chestY],[0.17,P.waistY]],em(0x6a0d18,0.35),36));for(var i=0;i<9;i++){var a=Math.PI*0.2+i*0.24,sp=S(new THREE.Mesh(new THREE.ConeGeometry(0.02,0.08,6),new THREE.MeshStandardMaterial({color:0x1a0a0a,roughness:0.5})));sp.position.set(Math.sin(a)*0.17,P.shoulderY-0.02,Math.cos(a)*0.17);sp.lookAt(0,P.shoulderY+0.4,0);g.add(sp);}}
  return g;}
function bSafe(id){var g=new THREE.Group(),c=0xa8c0e0;   // soft, kid-safe version — silhouette kept, edge removed
  if(id==='pauldron'){[-1,1].forEach(function(s){var p=S(new THREE.Mesh(new THREE.SphereGeometry(0.07,14,12),soft(c)));p.position.set(s*(P.shoulderX+0.02),P.shoulderY,0);p.scale.set(1,0.7,1);g.add(p);});}
  else if(id==='mantle'){g.add(lathe([[0.11,P.shoulderY+0.02],[0.18,P.chestY],[0.16,P.waistY]],soft(0x8fa8d0),36));}
  else{g.add(new THREE.Mesh(new THREE.SphereGeometry(0.05,10,8),soft(c)));}
  return g;}

/* the shared avatar's fixed loadout + each item's content rating */
var RANK={E:0,T:1,M:2};
var LOADOUT=[
  {id:'circlet',name:'Star Circlet',rating:'E'},
  {id:'cloak',  name:'Nebula Cloak', rating:'E'},
  {id:'pauldron',name:'Wraith Pauldron',rating:'T'},
  {id:'mantle', name:'Gorefiend Mantle',rating:'M'}
];

/* family accounts + attested credentials */
function hash(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(16);}
function tierFor(age){return age>=17?'M':age>=13?'T':'E';}
var ACCTS=[
  {id:'kai',name:'Kai',age:17,color:0x21d4fd},
  {id:'robin',name:'Robin',age:8,color:0xffc93c}
];
ACCTS.forEach(function(a){a.tier=tierFor(a.age);a.att={identity:hash('id:'+a.id),age:hash('age:'+a.age),family:hash('fam:vance:'+a.id)};});
var OWN={circlet:'robin',cloak:'kai',pauldron:'kai',mantle:'kai'};   // who owns each item
var LEDGER=[];
var viewer=ACCTS[0], mounted={};

function clearWorn(){for(var k in mounted){body.remove(mounted[k]);mounted[k].traverse(function(n){if(n.geometry)n.geometry.dispose();if(n.material)(Array.isArray(n.material)?n.material:[n.material]).forEach(function(m){m.dispose();});});}mounted={};}
function renderFor(v){
  clearWorn();var gated=0;
  LOADOUT.forEach(function(it){var allowed=RANK[it.rating]<=RANK[v.tier];var g=allowed?bReal(it.id):bSafe(it.id);mounted[it.id]=g;body.add(g);if(!allowed)gated++;});
  var noteEl=document.getElementById('note');
  if(gated)noteEl.innerHTML='<b style="color:var(--warn)">'+gated+' item(s) age-gated</b> for '+v.name+' (age '+v.age+' → '+v.tier+'-tier). Same avatar, same world — the mature cosmetics resolve to safe versions on this account. Big brother and little brother play together; the world adapts to each attested age.';
  else noteEl.innerHTML='<b style="color:var(--ok)">All items render.</b> '+v.name+' (age '+v.age+' → '+v.tier+'-tier) is cleared for everything on this avatar.';
}

/* ---- UI ---- */
function drawAccts(){var el=document.getElementById('accts');el.innerHTML='';ACCTS.forEach(function(a){var d=document.createElement('div');d.className='acct'+(a.id===viewer.id?' on':'');d.innerHTML='<div class="n" style="color:#'+a.color.toString(16)+'">'+a.name+'</div><div class="a">age '+a.age+'</div><div class="tier"><span class="rt '+a.tier+'">'+a.tier+'-tier</span></div>';d.onclick=function(){viewer=a;refresh();};el.appendChild(d);});}
function drawAtt(){var v=viewer;document.getElementById('attCard').innerHTML=
  '<div class="att"><span>identity</span><span class="v">✓ #'+v.att.identity+'</span></div>'+
  '<div class="att"><span>age (DOB-verified)</span><span class="v">✓ '+v.age+' → '+v.tier+'-tier</span></div>'+
  '<div class="att"><span>family · Vance</span><span class="v">✓ #'+v.att.family+'</span></div>'+
  '<div class="att"><span>content ceiling</span><span class="v">'+v.tier+' ('+(v.tier==='E'?'Everyone':v.tier==='T'?'Teen 13+':'Mature 17+')+')</span></div>';}
function drawLoadout(){var el=document.getElementById('loadout');el.innerHTML='';LOADOUT.forEach(function(it){var allowed=RANK[it.rating]<=RANK[viewer.tier];var d=document.createElement('div');d.className='item';d.innerHTML='<div><span class="nm">'+it.name+'</span> <span class="rt '+it.rating+'">'+it.rating+'</span><div class="meta">owner '+OWN[it.id]+'</div></div><div class="meta" style="color:'+(allowed?'var(--ok)':'var(--warn)')+'">'+(allowed?'renders':'→ safe version')+'</div>';el.appendChild(d);});}
function drawInv(){var el=document.getElementById('inv');el.innerHTML='';LOADOUT.forEach(function(it){var owner=OWN[it.id];var other=owner==='kai'?'robin':'kai';var d=document.createElement('div');d.className='item';
  d.innerHTML='<div><span class="nm">'+it.name+'</span> <span class="rt '+it.rating+'">'+it.rating+'</span><div class="meta">owned by '+owner+'</div></div>';
  var g=document.createElement('button');g.className='gift';g.textContent='gift → '+other+' (family·free)';g.onclick=function(){transfer(it,owner,other);};d.appendChild(g);el.appendChild(d);});}
function drawLedger(){var el=document.getElementById('ledger');if(!LEDGER.length){el.innerHTML='<span style="color:var(--muted)">no transfers yet — gift an item within the family</span>';return;}el.innerHTML=LEDGER.map(function(e){return '<span class="a">'+e.from+'</span> → <span class="a">'+e.to+'</span> · '+e.item+' · <span style="color:var(--ok)">'+e.policy+'</span> · <span class="s">sig '+e.sig+'</span>';}).join('<br>');}
function transfer(it,from,to){OWN[it.id]=to;LEDGER.unshift({item:it.name,from:from,to:to,policy:'family · free',sig:hash(it.id+from+to+LEDGER.length)});refresh();}
function refresh(){document.getElementById('povWho').textContent=viewer.name;document.getElementById('povAge').textContent='age '+viewer.age+' · '+viewer.tier+'-tier';drawAccts();drawAtt();drawLoadout();drawInv();drawLedger();renderFor(viewer);}

refresh();
function resize(){var w=canvas.clientWidth,h=canvas.clientHeight;if(w&&h&&(canvas.width!==w||canvas.height!==h)){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}}
function frame(){requestAnimationFrame(frame);resize();controls.update();renderer.render(scene,camera);}
frame();
}
</script>
</body>
</html>
