var BUDGET=9000, CLOTH={corset:1,meshtop:1,bootleg:1,jacket:1,harness:1,mini:1,pants:1,ears:1};
var REG={
  corset :{name:'Lace Corset',slot:'top',state:'approved',tris:2100,build:corset,color:0x4a0e16,fab:2},
  meshtop:{name:'Mesh Top',slot:'top',state:'approved',tris:1400,build:meshtop,color:0x14131a,fab:0},
  bootleg:{name:'Bootleg Tee',slot:'top',state:'custom',tris:1500,build:bootleg,color:0x14131a,fab:0},
  nsfw   :{name:'“NSFW” Top',slot:'top',state:'rejected',tris:600,build:nsfw,color:0xff2e88,fab:0},
  jacket :{name:'Moto Jacket',slot:'outer',state:'approved',tris:3200,build:jacket,color:0x14131a,fab:2},
  harness:{name:'O-Ring Harness',slot:'outer',state:'approved',tris:1600,build:harness,color:0x14131a,fab:2},
  mini   :{name:'Vinyl Mini',slot:'bottom',state:'approved',tris:1200,build:mini,color:0x14131a,fab:2},
  pants  :{name:'Custom Pants',slot:'bottom',state:'custom',tris:1600,build:pants,color:0x223055,fab:1},
  fishnet:{name:'Fishnets',slot:'legs',state:'approved',tris:900,build:fishnet,color:0x14131a,fab:0},
  boots  :{name:'Platform Boots',slot:'feet',state:'approved',tris:1500,build:boots,color:0x14131a,fab:0},
  choker :{name:'Spiked Choker',slot:'neck',state:'approved',tris:900,build:choker,color:0x14131a,fab:0},
  ears   :{name:'Cat Ears',slot:'head',state:'approved',tris:200,build:ears,color:0x2a1430,fab:4},
  crown  :{name:'God-Crown',slot:'head',state:'overbudget',tris:51000,build:crown,color:0xffd35b,fab:0}
};
var SLOTS=['outer','top','bottom','legs','feet','neck','head'];
var PALETTE=[0x14131a,0x7a1020,0x5b2a86,0xc01f7b,0x3fae5a,0x6b7280,0xe7e2d6,0x4a0e16,0x2563eb,0xff9ec7];

/* ---- gate state ---- */
var revoked={},fallbackPolicy='generic',trustModel='validate',hacked=false;
var equip={};   // slot -> {id,color,fab}
var selSlot=null;
function inManifest(id){return REG[id]&&REG[id].state==='approved'&&!revoked[id];}
function manifestIds(){return Object.keys(REG).filter(inManifest);}
function sig(){var s=manifestIds().sort().join(',');var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(16);}
function decide(id){if(!id)return{allow:false,reason:'empty'};if(trustModel==='trust'){if(hacked)return{allow:true,reason:'client-claimed (INSECURE)'};return inManifest(id)?{allow:true,reason:'approved'}:{allow:false,reason:'client says no'};}if(inManifest(id))return{allow:true,reason:'approved'};if(revoked[id])return{allow:false,reason:'revoked'};var st=REG[id]?REG[id].state:'unknown';if(st==='overbudget')return{allow:false,reason:'over budget ('+REG[id].tris.toLocaleString()+'>'+BUDGET.toLocaleString()+')'};if(st==='rejected')return{allow:false,reason:'moderation-rejected'};if(st==='custom')return{allow:false,reason:'unapproved custom'};return{allow:false,reason:'not in manifest'};}

/* ---- stages ---- */
function makeStage(id,small){var canvas=document.getElementById(id);var r=new THREE.WebGLRenderer({canvas:canvas,antialias:true});r.setPixelRatio(Math.min(window.devicePixelRatio,2));r.physicallyCorrectLights=true;r.outputEncoding=THREE.sRGBEncoding;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.12;r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;
  var sc=new THREE.Scene();sc.background=new THREE.Color(0x0b0a10);sc.fog=new THREE.Fog(0x0b0a10,3.5,10);
  var cam=new THREE.PerspectiveCamera(40,1,0.1,100);cam.position.set(0.3,1.15,small?3.0:2.7);
  var ct=new THREE.OrbitControls(cam,canvas);ct.target.set(0,1.02,0);ct.enableDamping=true;ct.minDistance=1.3;ct.maxDistance=5;ct.maxPolarAngle=Math.PI*0.9;if(small)ct.enabled=false;
  sc.add(new THREE.HemisphereLight(0xbfb9e0,0x16121f,0.8));
  var key=new THREE.SpotLight(0xffffff,72,20,Math.PI/5,0.4,1.5);key.position.set(2.5,4.5,3.2);key.castShadow=true;key.shadow.mapSize.set(small?1024:2048,small?1024:2048);key.shadow.bias=-0.0004;sc.add(key,key.target);
  sc.add(Object.assign(new THREE.PointLight(0xff2e88,34,12,2),{position:new THREE.Vector3(-2.4,1.6,-1.3)}));
  sc.add(Object.assign(new THREE.PointLight(0x21d4fd,30,12,2),{position:new THREE.Vector3(2.4,1.5,-1.7)}));
  var fl=new THREE.Mesh(new THREE.CircleGeometry(3,48),new THREE.MeshStandardMaterial({color:0x111018,roughness:0.4,metalness:0.5}));fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;sc.add(fl);
  var body=buildBody();sc.add(body);
  return {canvas:canvas,r:r,sc:sc,cam:cam,ct:ct,body:body,worn:{}};}
var self_=makeStage('main',false), peer=makeStage('peer',true);
function clearWorn(st){for(var s in st.worn){if(st.worn[s]){st.body.remove(st.worn[s]);st.worn[s].traverse(function(n){if(n.geometry)n.geometry.dispose();if(n.material)(Array.isArray(n.material)?n.material:[n.material]).forEach(function(m){if(m.normalMap&&!m.normalMap.__shared)m.normalMap.dispose();m.dispose();});});}}st.worn={};}
function clothMat(entry,item){if(CLOTH[entry.id]&&entry.fab>0){var m=fabricMat(entry.fab,entry.color);if(m.normalMap)m.normalMap.__shared=true;return m;}if(CLOTH[entry.id])return fabricMat(0,entry.color);return mat(entry.color,'leather');}

function rebuild(){
  clearWorn(self_);clearWorn(peer);
  SLOTS.forEach(function(slot){var e=equip[slot];if(!e)return;var it=REG[e.id];
    var gS=it.build(clothMat(e,it));self_.worn[slot]=gS;self_.body.add(gS);
    var d=decide(e.id);
    if(d.allow){var gP=it.build(clothMat(e,it));peer.worn[slot]=gP;peer.body.add(gP);}
    else if(fallbackPolicy==='generic'){var f=generic(slot);peer.worn[slot]=f;peer.body.add(f);}
  });
  // gate message
  var msgs=[];SLOTS.forEach(function(slot){var e=equip[slot];if(!e)return;var d=decide(e.id);msgs.push((d.allow?'<span style="color:var(--ok)">✓</span> ':'<span style="color:var(--bad)">✗</span> ')+REG[e.id].name+(d.allow?'':' <span style="color:var(--warn)">'+d.reason+'</span>'));});
  document.getElementById('gatemsg').innerHTML=msgs.join('<br>')||'nothing worn';
  document.getElementById('wire').innerHTML='⟶ wire: <b>'+JSON.stringify(wireState())+'</b><br><span style="color:var(--muted)">IDs only, never bytes</span>';
  refreshUI();
}
function wireState(){var o={};SLOTS.forEach(function(s){if(equip[s])o[s]=equip[s].id;});return o;}

/* ---- UI ---- */
function badge(id){var st=REG[id].state;if(revoked[id])return '<span class="badge b-rev">revoked</span>';return st==='approved'?'<span class="badge b-appr">approved</span>':st==='custom'?'<span class="badge b-cust">custom</span>':st==='rejected'?'<span class="badge b-rej">rejected</span>':'<span class="badge b-over">over-budget</span>';}
function buildWardrobe(){var w=document.getElementById('wardrobe');w.innerHTML='';SLOTS.forEach(function(slot){var items=Object.keys(REG).filter(function(id){return REG[id].slot===slot;});if(!items.length)return;var lbl=document.createElement('div');lbl.className='rowlbl';lbl.textContent=slot;w.appendChild(lbl);var grid=document.createElement('div');grid.className='grid';items.forEach(function(id){var c=document.createElement('div');c.className='card';c.dataset.id=id;c.innerHTML='<div class="nm">'+REG[id].name+'</div><div class="bd">'+badge(id)+'</div>';c.onclick=function(){var e=equip[slot];if(e&&e.id===id){equip[slot]=null;selSlot=null;}else{equip[slot]={id:id,color:REG[id].color,fab:REG[id].fab};selSlot=slot;}rebuild();};grid.appendChild(c);});w.appendChild(grid);});}
function buildSwatches(){var s=document.getElementById('swatches');s.innerHTML='';PALETTE.forEach(function(hex){var b=document.createElement('button');b.className='sw';b.style.background='#'+hex.toString(16).padStart(6,'0');b.onclick=function(){if(!selSlot||!equip[selSlot])return;equip[selSlot].color=hex;rebuild();};s.appendChild(b);});}
function buildFabs(){var f=document.getElementById('fabs');f.innerHTML='';FAB.forEach(function(fb,i){var b=document.createElement('button');b.className='fab';b.textContent=fb.name;b.onclick=function(){if(!selSlot||!equip[selSlot])return;if(!CLOTH[equip[selSlot].id])return;equip[selSlot].fab=i;rebuild();};f.appendChild(b);});}
function buildFallback(){var f=document.getElementById('fallback');f.innerHTML='';[['generic','generic garment'],['hide','hide item']].forEach(function(o){var b=document.createElement('button');b.className='opt'+(fallbackPolicy===o[0]?' on':'');b.textContent=o[1];b.onclick=function(){fallbackPolicy=o[0];rebuild();};f.appendChild(b);});}
function buildManifestChips(){var m=document.getElementById('manifestChips');m.innerHTML='';Object.keys(REG).filter(function(id){return REG[id].state==='approved';}).forEach(function(id){var b=document.createElement('button');b.className='opt'+(revoked[id]?'':' on');b.textContent=(revoked[id]?'⟲ ':'⊘ ')+REG[id].name;b.onclick=function(){revoked[id]=!revoked[id];rebuild();};m.appendChild(b);});}
function refreshUI(){
  [].forEach.call(document.querySelectorAll('#wardrobe .card'),function(c){var slot=REG[c.dataset.id].slot,on=equip[slot]&&equip[slot].id===c.dataset.id;c.classList.toggle('on',on);c.classList.toggle('sel',on&&selSlot===slot);c.querySelector('.bd').innerHTML=badge(c.dataset.id);});
  var e=selSlot&&equip[selSlot];document.getElementById('editing').textContent='selected: '+(e?REG[e.id].name:'—');
  [].forEach.call(document.querySelectorAll('#swatches .sw'),function(b,i){b.classList.toggle('on',!!e&&equip[selSlot].color===PALETTE[i]);});
  [].forEach.call(document.querySelectorAll('#fabs .fab'),function(b,i){b.classList.toggle('on',!!e&&CLOTH[equip[selSlot].id]&&equip[selSlot].fab===i);});
  buildManifestChips();
  document.getElementById('manifest').innerHTML='approved <b>'+manifestIds().length+'</b>/'+Object.keys(REG).length+' · <span class="sig">sig '+sig()+'</span> · budget '+BUDGET.toLocaleString()+' tris';
  document.getElementById('oTrust').textContent=trustModel==='validate'?'validate manifest ✓':'trust client ✗';
  document.getElementById('oTrust').classList.toggle('on',trustModel==='validate');
  document.getElementById('oHack').classList.toggle('on',hacked);
}
document.getElementById('oTrust').onclick=function(){trustModel=trustModel==='validate'?'trust':'validate';rebuild();};
document.getElementById('oHack').onclick=function(){hacked=!hacked;rebuild();};

buildWardrobe();buildSwatches();buildFabs();buildFallback();
equip.top={id:'corset',color:0xc01f7b,fab:2};equip.bottom={id:'mini',color:0x14131a,fab:2};equip.feet={id:'boots',color:0x14131a,fab:0};equip.neck={id:'choker',color:0x14131a,fab:0};selSlot='top';
rebuild();

/* ---- render ---- */
var clock=new THREE.Clock();
function rs(st){var w=st.canvas.clientWidth,h=st.canvas.clientHeight;if(w&&h&&(st.canvas.width!==w||st.canvas.height!==h)){st.r.setSize(w,h,false);st.cam.aspect=w/h;st.cam.updateProjectionMatrix();}}
function tick(){requestAnimationFrame(tick);var dt=clock.getDelta();
  self_.body.rotation.y+=dt*0.28;peer.body.rotation.y=self_.body.rotation.y; // peer mirrors your orientation
  [self_,peer].forEach(function(st){rs(st);st.ct.update();st.r.render(st.sc,st.cam);});}
tick();
}
</script>
</body>
</html>
