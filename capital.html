<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>THE CAPITAL · Crypt Engine testing grounds</title>
<style>
:root{--ink:#f2eef8;--muted:#9c97b8;--accent:#ff2e88;--accent-2:#21d4fd;--line:#2a2740;}
*{box-sizing:border-box;} html,body{margin:0;height:100%;background:#05040a;}
body{color:var(--ink);font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
/* cinematic overlays */
#vignette{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse 62% 62% at 50% 46%,transparent 40%,rgba(3,2,8,.55) 78%,rgba(3,2,8,.92) 100%);}
#grain{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.05;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
#bars{position:fixed;inset:0;pointer-events:none;z-index:2;}
#bars::before,#bars::after{content:'';position:absolute;left:0;right:0;height:7vh;background:#05040a;}
#bars::before{top:0;} #bars::after{bottom:0;}
.hud{position:fixed;z-index:5;}
#brand{top:calc(7vh + 14px);left:18px;}
#brand h1{margin:0;font-size:22px;letter-spacing:3px;font-weight:700;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;}
#brand .s{margin:2px 0 0;font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
#cred{top:calc(7vh + 14px);right:18px;text-align:right;}
#cred .from{font-size:10px;letter-spacing:3px;color:var(--muted);}
#cred .name{font-size:16px;letter-spacing:2px;font-weight:700;color:var(--ink);}
#cred .titles{font-size:10px;letter-spacing:1px;color:var(--accent-2);margin-top:1px;}
#look{position:fixed;left:0;right:0;bottom:calc(7vh + 20px);z-index:5;text-align:center;pointer-events:none;}
#look .nm{font-size:30px;letter-spacing:8px;font-weight:700;text-transform:uppercase;text-shadow:0 0 24px rgba(255,46,136,.5);}
#look .dots{margin-top:12px;display:flex;gap:9px;justify-content:center;pointer-events:auto;}
#look .dot{width:9px;height:9px;border-radius:50%;background:#3a3550;border:none;cursor:pointer;padding:0;transition:.2s;}
#look .dot.on{background:var(--accent);box-shadow:0 0 10px var(--accent);transform:scale(1.25);}
#ctes{position:fixed;bottom:calc(7vh + 16px);right:18px;z-index:5;display:flex;gap:8px;}
#ctes button{background:#1a1728cc;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit;font-size:12px;cursor:pointer;backdrop-filter:blur(6px);}
#ctes button:hover{border-color:var(--accent-2);}
#ctes button.on{border-color:var(--accent);color:#fff;}
#cta{position:fixed;bottom:calc(7vh + 16px);left:18px;z-index:5;font-size:12px;color:var(--muted);letter-spacing:1px;}
#cta b{color:var(--accent-2);}
#foot{position:fixed;bottom:9px;left:0;right:0;z-index:5;text-align:center;font-size:9px;letter-spacing:2px;color:#5a556e;}
#district{position:fixed;top:calc(7vh + 60px);left:0;right:0;z-index:5;text-align:center;pointer-events:none;}
#district .tag{font-size:9px;letter-spacing:3px;color:#05040a;background:var(--accent-2);padding:2px 8px;border-radius:4px;font-weight:700;vertical-align:middle;}
#district #dName{font-size:14px;letter-spacing:4px;color:var(--ink);margin-left:9px;text-transform:uppercase;vertical-align:middle;}
#district #dStatus{display:block;font-size:9px;letter-spacing:2px;color:var(--muted);margin-top:4px;}
#district.slot .tag{background:var(--accent);color:#fff;}
#district.slot #dName{color:#37d67a;}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05040a;color:#9c97b8;z-index:50;letter-spacing:2px;}
@media (max-width:680px){#brand h1{font-size:17px;}#look .nm{font-size:20px;letter-spacing:5px;}#cred .name{font-size:13px;}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="bars"></div><div id="vignette"></div><div id="grain"></div>
<div id="brand" class="hud"><h1>⛧ THE CAPITAL</h1><div class="s">Crypt Engine · testing grounds</div></div>
<div id="cred" class="hud"><div class="from">FROM</div><div class="name">RYAN CASHMAN</div><div class="titles" id="titles">[ shipped-title credits ]</div></div>
<div id="district" class="hud"><span class="tag" id="dTag">LICENSED DISTRICT</span><span id="dName">—</span><span id="dStatus"></span></div>
<div id="look"><div class="nm" id="lookName">—</div><div class="dots" id="dots"></div></div>
<div id="ctes"><button id="bAuto" class="on">▮▮ auto</button><button id="bPrev">‹</button><button id="bNext">›</button></div>
<div id="cta">wishlist · <b>the-capital.xyz</b></div>
<div id="foot">ENGINE TESTING GROUNDS · CLAUDE × GROK BUILD</div>
<div id="boot">entering the capital…</div>

<script>
(function(){function ls(u,d){var i=0;(function n(){if(i>=u.length){d(new Error('cdn'));return;}var s=document.createElement('script');s.src=u[i++];s.onload=function(){d(null);};s.onerror=n;document.head.appendChild(s);})();}
  ls(['https://unpkg.com/three@0.147.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/0.147.0/three.min.js'],function(e){
    if(e||!window.THREE){document.getElementById('boot').textContent='couldn\'t load the engine.';return;}
    ls(['https://unpkg.com/three@0.147.0/examples/js/controls/OrbitControls.js','https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js'],function(){var b=document.getElementById('boot');if(b)b.remove();start();});
  });})();

function start(){
"use strict";
if(typeof THREE.OrbitControls!=='function'){THREE.OrbitControls=function(c){this.target=new THREE.Vector3();this.update=function(){};};}
var P={ankleY:0.09,kneeY:0.52,hipY:0.96,waistY:1.07,chestY:1.27,shoulderY:1.44,neckY:1.50,headY:1.64,topY:1.74,legX:0.095,shoulderX:0.175,thighR:0.095,calfR:0.07,neckR:0.052,headR:0.10};
var canvas=document.getElementById('scene');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.physicallyCorrectLights=true;renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;

var scene=new THREE.Scene();scene.background=new THREE.Color(0x05040a);scene.fog=new THREE.FogExp2(0x05040a,0.052);
var camera=new THREE.PerspectiveCamera(38,1,0.1,120);camera.position.set(0.5,1.25,3.4);
var controls=new THREE.OrbitControls(camera,canvas);controls.target.set(0,1.02,0);controls.enableDamping=true;controls.dampingFactor=0.06;controls.autoRotate=true;controls.autoRotateSpeed=0.55;controls.minDistance=1.6;controls.maxDistance=5.5;controls.maxPolarAngle=Math.PI*0.9;controls.enablePan=false;

/* procedural cosmic IBL for reflections */
function envTex(){var c=document.createElement('canvas');c.width=512;c.height=256;var x=c.getContext('2d');var g=x.createLinearGradient(0,0,0,256);g.addColorStop(0,'#2a2550');g.addColorStop(.5,'#120e22');g.addColorStop(1,'#05040a');x.fillStyle=g;x.fillRect(0,0,512,256);x.globalAlpha=.5;x.fillStyle='#ff2e88';x.beginPath();x.arc(130,150,80,0,7);x.fill();x.fillStyle='#21d4fd';x.beginPath();x.arc(400,120,80,0,7);x.fill();x.globalAlpha=1;var t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;return t;}
var pmrem=new THREE.PMREMGenerator(renderer);pmrem.compileEquirectangularShader();scene.environment=pmrem.fromEquirectangular(envTex()).texture;

/* lights */
scene.add(new THREE.HemisphereLight(0x8f89c0,0x0a0812,0.5));
var key=new THREE.SpotLight(0xffffff,60,25,Math.PI/5,0.45,1.5);key.position.set(3,5.5,3.5);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.bias=-0.0004;scene.add(key,key.target);
var rimA=new THREE.PointLight(0xff2e88,44,16,2);rimA.position.set(-2.8,1.7,-1.6);scene.add(rimA);
var rimB=new THREE.PointLight(0x21d4fd,40,16,2);rimB.position.set(2.8,1.5,-2.0);scene.add(rimB);
var uplight=new THREE.PointLight(0xffffff,10,6,2);uplight.position.set(0,0.2,0.6);scene.add(uplight);

/* reflective floor */
var floor=new THREE.Mesh(new THREE.CircleGeometry(7,64),new THREE.MeshStandardMaterial({color:0x0a0912,roughness:0.18,metalness:0.85}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);

/* ---- CAPITAL DISTRICTS: IP-licensed zones (the business model, made visible) ----
   Placeholder district identities + an explicit "vendor slot" plot. Real IP
   (Warner/Lego/etc.) leases a slot and their signed manifest governs the zone —
   same gate as wearables, scoped to world-space. */
var dLight=new THREE.PointLight(0x21d4fd,16,22,2);dLight.position.set(0,3.2,-6.5);scene.add(dLight);
function buildings(x,W,H,acc,cap,dens){var bx=0;while(bx<W){var bw=40+Math.random()*110,bh=120+Math.random()*260,top=H-bh;x.fillStyle='#070510';x.fillRect(bx,top,bw,bh);
  if(cap==='spire'){x.beginPath();x.moveTo(bx,top);x.lineTo(bx+bw/2,top-70-Math.random()*70);x.lineTo(bx+bw,top);x.closePath();x.fill();}
  else if(cap==='block'){x.fillRect(bx+bw*0.18,top-34,bw*0.64,34);x.fillRect(bx+bw*0.34,top-60,bw*0.32,26);}
  else if(cap==='market'){x.fillRect(bx-4,top-9,bw+8,9);}
  x.fillStyle=acc;x.globalAlpha=0.9;for(var wy=top+16;wy<H-6;wy+=15)for(var wx=bx+7;wx<bx+bw-7;wx+=13){if(Math.random()<dens)x.fillRect(wx,wy,5,7);}x.globalAlpha=1;
  bx+=bw+8+Math.random()*18;}}
function plotSlot(x,W,H,acc){buildings(x,W*0.28,H,acc,'spire',0.2);x.save();x.translate(W*0.34,0);x.strokeStyle=acc;x.lineWidth=4;x.setLineDash([18,14]);x.strokeRect(20,H-300,W*0.32,290);x.setLineDash([]);x.fillStyle=acc;x.globalAlpha=0.6;x.font='bold 40px system-ui';x.textAlign='center';x.fillText('◇ PLOT FOR LEASE',W*0.16+20,H-150);x.globalAlpha=1;x.restore();x.save();x.translate(W*0.72,0);buildings(x,W*0.28,H,acc,'block',0.25);x.restore();}
var DISTRICTS=[
  {name:'Crypt Quarter', status:'HOME DISTRICT', accent:0xff2e88, draw:function(x,W,H,a){buildings(x,W,H,a,'spire',0.25);}},
  {name:'Wyrd Hollow', status:'LEASED · vendor IP', accent:0x9b6cff, draw:function(x,W,H,a){buildings(x,W,H,a,'spire',0.32);}},
  {name:'Brickhaven', status:'LEASED · vendor IP', accent:0xffc93c, draw:function(x,W,H,a){buildings(x,W,H,a,'block',0.42);}},
  {name:'Neon Souk', status:'LEASED · vendor IP', accent:0x21d4fd, draw:function(x,W,H,a){buildings(x,W,H,a,'market',0.55);}},
  {name:'◇ Your IP Here', status:'AVAILABLE · vendor slot', accent:0x37d67a, slot:true, draw:function(x,W,H,a){plotSlot(x,W,H,a);}}
];
var skyMat=new THREE.MeshBasicMaterial({transparent:true,side:THREE.BackSide,depthWrite:false,fog:true});
var skyline=new THREE.Mesh(new THREE.CylinderGeometry(9,9,7,64,1,true),skyMat);skyline.position.y=3.5;scene.add(skyline);
function skylineTex(d){var W=2048,H=512,c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext('2d');x.clearRect(0,0,W,H);d.draw(x,W,H,'#'+d.accent.toString(16).padStart(6,'0'));var t=new THREE.CanvasTexture(c);t.wrapS=THREE.RepeatWrapping;t.wrapT=THREE.ClampToEdgeWrapping;t.repeat.set(2,1);return t;}
var dcur=0;
function setDistrict(i){dcur=(i+DISTRICTS.length)%DISTRICTS.length;var d=DISTRICTS[dcur];var old=skyMat.map;skyMat.map=skylineTex(d);skyMat.needsUpdate=true;if(old)old.dispose();dLight.color.setHex(d.accent);
  document.getElementById('dName').textContent=d.name;document.getElementById('dStatus').textContent=d.status;document.getElementById('dTag').textContent=d.slot?'◇ VENDOR SLOT':'LICENSED DISTRICT';document.getElementById('district').classList.toggle('slot',!!d.slot);}
setDistrict(0);

/* cosmic portal backdrop (echoes the trailer's black-hole motif) — billboarded, always behind the muse */
function portalTex(){var s=512,c=document.createElement('canvas');c.width=c.height=s;var x=c.getContext('2d');x.clearRect(0,0,s,s);var cx=s/2,cy=s/2;var g=x.createRadialGradient(cx,cy,s*0.05,cx,cy,s*0.5);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(0.30,'rgba(6,4,12,1)');g.addColorStop(0.40,'rgba(255,120,40,0.95)');g.addColorStop(0.46,'rgba(255,60,120,0.75)');g.addColorStop(0.60,'rgba(80,40,160,0.35)');g.addColorStop(0.80,'rgba(20,16,40,0.10)');g.addColorStop(1,'rgba(5,4,10,0)');x.fillStyle=g;x.beginPath();x.arc(cx,cy,s*0.5,0,7);x.fill();var t=new THREE.CanvasTexture(c);return t;}
var portal=new THREE.Mesh(new THREE.PlaneGeometry(15,15),new THREE.MeshBasicMaterial({map:portalTex(),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));portal.renderOrder=-1;scene.add(portal);

/* drifting star particles */
var pc=1600,pg=new THREE.BufferGeometry(),pp=new Float32Array(pc*3);for(var i=0;i<pc;i++){var r=2+Math.random()*7,a=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);pp[i*3]=r*Math.sin(ph)*Math.cos(a);pp[i*3+1]=Math.random()*5;pp[i*3+2]=r*Math.sin(ph)*Math.sin(a);}pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
var stars=new THREE.Points(pg,new THREE.PointsMaterial({color:0xbfd8ff,size:0.02,transparent:true,opacity:0.7,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(stars);

/* ---- the muse: refined body + flowing gown (gown carries the swappable look) ---- */
var SKIN=new THREE.MeshStandardMaterial({color:0xe8c4a8,roughness:0.55});
var HAIR=new THREE.MeshStandardMaterial({color:0x0d0b12,roughness:0.5,metalness:0.1});
var gownMat=new THREE.MeshStandardMaterial({color:0xdfe6ff,roughness:0.2,metalness:0.2,side:THREE.DoubleSide,transparent:true,opacity:1,emissive:0x000000,emissiveIntensity:1});
function SH(m){m.castShadow=true;m.receiveShadow=true;return m;}
function lathe(pts,m,seg){return SH(new THREE.Mesh(new THREE.LatheGeometry(pts.map(function(p){return new THREE.Vector2(p[0],p[1]);}),seg||48),m));}
var muse=new THREE.Group();
(function(){
  // upper body / skin
  var pel=SH(new THREE.Mesh(new THREE.SphereGeometry(0.15,28,20),SKIN));pel.position.set(0,P.hipY-0.05,0);pel.scale.set(1,0.7,0.85);muse.add(pel);
  [-1,1].forEach(function(s){var b=SH(new THREE.Mesh(new THREE.SphereGeometry(0.07,24,18),SKIN));b.position.set(s*0.06,P.chestY+0.01,0.10);b.scale.set(1,0.9,0.8);muse.add(b);});
  var neck=SH(new THREE.Mesh(new THREE.CylinderGeometry(P.neckR,P.neckR+0.01,0.09,16),SKIN));neck.position.set(0,P.neckY+0.05,0);muse.add(neck);
  var head=SH(new THREE.Mesh(new THREE.SphereGeometry(P.headR,36,28),SKIN));head.position.set(0,P.headY,0);head.scale.set(0.92,1.1,0.95);muse.add(head);
  var hb=SH(new THREE.Mesh(new THREE.SphereGeometry(P.headR+0.02,26,20),HAIR));hb.position.set(0,P.headY+0.01,-0.012);hb.scale.set(1.06,1.2,1.06);muse.add(hb);
  var bk=SH(new THREE.Mesh(new THREE.CapsuleGeometry(0.12,0.5,12,20),HAIR));bk.position.set(0,P.headY-0.28,-0.05);bk.scale.set(0.9,1,0.5);muse.add(bk);
  [-1,1].forEach(function(s){var up=SH(new THREE.Mesh(new THREE.CapsuleGeometry(0.045,0.26,12,18),SKIN));up.position.set(s*(P.shoulderX+0.02),P.shoulderY-0.16,0);up.rotation.z=s*0.16;muse.add(up);
    var fo=SH(new THREE.Mesh(new THREE.CapsuleGeometry(0.037,0.24,12,18),SKIN));fo.position.set(s*(P.shoulderX+0.075),P.shoulderY-0.44,0);fo.rotation.z=s*0.12;muse.add(fo);});
  // gown: fitted bodice + flowing floor-length skirt (the LOOK lives here)
  muse.add(lathe([[0.10,P.shoulderY-0.02],[0.155,P.chestY+0.04],[0.15,P.chestY-0.03],[0.128,P.waistY]],gownMat,48));
  muse.add(lathe([[0.128,P.waistY],[0.150,P.hipY+0.02],[0.20,P.kneeY+0.10],[0.30,P.kneeY-0.20],[0.40,P.ankleY+0.06],[0.44,P.ankleY-0.02]],gownMat,64));
  // sheer train behind
  var train=lathe([[0.30,P.hipY],[0.42,P.kneeY],[0.58,P.ankleY+0.10],[0.66,P.ankleY-0.02]],gownMat,64);train.position.z=-0.06;train.scale.set(1,1,0.7);muse.add(train);
})();
muse.traverse(function(o){if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
scene.add(muse);

/* emissive pattern maps per look (white pattern on black => only pattern glows) */
function patt(kind){var s=256,c=document.createElement('canvas');c.width=c.height=s;var x=c.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,s,s);x.strokeStyle='#fff';x.fillStyle='#fff';x.lineWidth=2;
  if(kind==='circuit'){for(var i=0;i<26;i++){var y=Math.random()*s,ln=40+Math.random()*140,xx=Math.random()*s;x.beginPath();x.moveTo(xx,y);x.lineTo(xx+ln,y);x.lineTo(xx+ln,y+(Math.random()*60-30));x.stroke();x.beginPath();x.arc(xx,y,2.5,0,7);x.fill();}}
  else if(kind==='crack'){for(var k=0;k<10;k++){var px=Math.random()*s,py=Math.random()*s;for(var j=0;j<6;j++){var nx=px+(Math.random()*60-30),ny=py+(Math.random()*60-30);x.beginPath();x.lineWidth=1+Math.random()*2;x.moveTo(px,py);x.lineTo(nx,ny);x.stroke();px=nx;py=ny;}}}
  else if(kind==='rune'){x.font='26px serif';var gl='ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟ';for(var r=0;r<70;r++){x.globalAlpha=0.5+Math.random()*0.5;x.fillText(gl[(Math.random()*gl.length)|0],Math.random()*s,Math.random()*s);}x.globalAlpha=1;}
  else if(kind==='branch'){(function br(px,py,ang,len,d){if(d>5||len<4)return;var nx=px+Math.cos(ang)*len,ny=py+Math.sin(ang)*len;x.lineWidth=d<2?2:1;x.beginPath();x.moveTo(px,py);x.lineTo(nx,ny);x.stroke();br(nx,ny,ang-0.4,len*0.72,d+1);br(nx,ny,ang+0.4,len*0.72,d+1);})(s/2,s,-Math.PI/2,50,0);(function br(px,py,ang,len,d){if(d>5||len<4)return;var nx=px+Math.cos(ang)*len,ny=py+Math.sin(ang)*len;x.beginPath();x.moveTo(px,py);x.lineTo(nx,ny);x.stroke();br(nx,ny,ang-0.5,len*0.7,d+1);br(nx,ny,ang+0.3,len*0.7,d+1);})(s/2,0,Math.PI/2,45,0);}
  var t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,3);return t;}

/* ---- the five looks (mirror the trailer's transformations) ---- */
var LOOKS=[
  {name:'Celestial', color:0xdfe6ff, emissive:0x2a3f7a, ei:0.7, rough:0.12, metal:0.25, opacity:1.0, map:null},
  {name:'Neon Circuit', color:0x0e0d16, emissive:0x21d4fd, ei:2.4, rough:0.4, metal:0.3, opacity:1.0, map:'circuit'},
  {name:'Molten', color:0x160806, emissive:0xff5a1e, ei:2.6, rough:0.5, metal:0.1, opacity:1.0, map:'crack'},
  {name:'Blood Rune', color:0x0a0507, emissive:0xff2038, ei:2.2, rough:0.55, metal:0.15, opacity:1.0, map:'rune'},
  {name:'Tree of Light', color:0xecf3ff, emissive:0x8fd0ff, ei:1.6, rough:0.25, metal:0.1, opacity:0.9, map:'branch'}
];
var MAPS={};['circuit','crack','rune','branch'].forEach(function(k){MAPS[k]=patt(k);});
var cur=0, target=LOOKS[0], tgtColor=new THREE.Color(), tgtEm=new THREE.Color();
function setLook(i){cur=(i+LOOKS.length)%LOOKS.length;target=LOOKS[cur];tgtColor.setHex(target.color);tgtEm.setHex(target.emissive);gownMat.emissiveMap=target.map?MAPS[target.map]:null;gownMat.needsUpdate=true;SKIN.emissive.setHex(target.emissive).multiplyScalar(0.05);
  document.getElementById('lookName').textContent=target.name;
  [].forEach.call(document.querySelectorAll('#dots .dot'),function(d,k){d.classList.toggle('on',k===cur);});}
// dots
var dotsEl=document.getElementById('dots');LOOKS.forEach(function(l,i){var b=document.createElement('button');b.className='dot';b.onclick=function(){setLook(i);auto=false;document.getElementById('bAuto').classList.remove('on');};dotsEl.appendChild(b);});
setLook(0);
// controls
var auto=true, tAcc=0, dAcc=0;
document.getElementById('bAuto').onclick=function(){auto=!auto;this.classList.toggle('on',auto);};
document.getElementById('bPrev').onclick=function(){setLook(cur-1);};
document.getElementById('bNext').onclick=function(){setLook(cur+1);};

/* ---- render ---- */
var clock=new THREE.Clock();
function resize(){var w=canvas.clientWidth,h=canvas.clientHeight;if(w&&h&&(canvas.width!==w||canvas.height!==h)){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}}
function frame(){requestAnimationFrame(frame);var dt=Math.min(clock.getDelta(),0.05),t=clock.elapsedTime;
  // muse idle: gentle breathing sway
  muse.rotation.z=Math.sin(t*0.8)*0.012; muse.position.y=Math.sin(t*0.9)*0.006;
  stars.rotation.y+=dt*0.02;
  // tween gown toward target look
  gownMat.color.lerp(tgtColor,0.06); gownMat.emissive.lerp(tgtEm,0.06);
  gownMat.emissiveIntensity+=(target.ei-gownMat.emissiveIntensity)*0.06;
  gownMat.roughness+=(target.rough-gownMat.roughness)*0.06;
  gownMat.metalness+=(target.metal-gownMat.metalness)*0.06;
  gownMat.opacity+=(target.opacity-gownMat.opacity)*0.06;
  // auto-cycle looks (great for screen-recording the swap)
  if(auto){tAcc+=dt;if(tAcc>4.5){tAcc=0;setLook(cur+1);}}
  // auto-tour districts (slower) — shows the Capital as sellable IP real estate
  if(auto){dAcc+=dt;if(dAcc>9){dAcc=0;setDistrict(dcur+1);}}
  // keep the portal behind the muse from the camera's view, billboarded
  var dir=new THREE.Vector3().subVectors(controls.target,camera.position).setY(0).normalize();
  portal.position.set(controls.target.x+dir.x*4.5,1.5,controls.target.z+dir.z*4.5);portal.lookAt(camera.position);
  resize();controls.update();renderer.render(scene,camera);
}
frame();
}
</script>
</body>
