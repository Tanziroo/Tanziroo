<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Approval Gate · self-view vs peer-view</title>
<style>
:root{--bg:#0b0a10;--panel:#141220;--ink:#ece9f5;--muted:#9c97b8;--accent:#ff2e88;--accent-2:#21d4fd;--ok:#37d67a;--warn:#f5c451;--bad:#ff6b6b;--line:#2a2740;}
*{box-sizing:border-box;} html,body{margin:0;height:100%;}
body{background:var(--bg);color:var(--ink);font-family:'SFMono-Regular',Consolas,'Roboto Mono',monospace;overflow:hidden;-webkit-tap-highlight-color:transparent;}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;}
#views{display:flex;flex:1;min-height:0;gap:2px;}
.view{position:relative;flex:1;min-width:0;background:#08070d;}
.view canvas{width:100%;height:100%;display:block;touch-action:none;}
.vlabel{position:absolute;top:8px;left:8px;font-size:12px;background:#141220cc;border:1px solid var(--line);border-radius:8px;padding:6px 9px;backdrop-filter:blur(6px);}
.vlabel b{font-size:13px;}
.self .vlabel b{color:var(--accent-2);} .peer .vlabel b{color:var(--accent);}
.gatelog{position:absolute;bottom:8px;left:8px;right:8px;font-size:11px;line-height:1.5;background:#141220cc;border:1px solid var(--line);border-radius:8px;padding:6px 9px;max-height:38%;overflow:auto;backdrop-filter:blur(6px);}
.gatelog .ok{color:var(--ok);} .gatelog .warn{color:var(--warn);} .gatelog .bad{color:var(--bad);} .gatelog .mut{color:var(--muted);}
#wire{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;background:#0b0a10ee;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:10.5px;color:var(--muted);text-align:center;pointer-events:none;max-width:56%;}
#wire b{color:var(--ink);}
#ctl{background:var(--panel);border-top:1px solid var(--line);padding:8px 10px;overflow:auto;max-height:44vh;}
.rowlbl{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:6px 2px 4px;}
.chips{display:flex;flex-wrap:wrap;gap:5px;}
.chip{background:#211d36;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit;font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:6px;}
.chip:hover{border-color:#4a4566;}
.chip.on{border-color:var(--accent);background:#2a1636;color:#fff;}
.badge{font-size:9px;padding:1px 5px;border-radius:5px;border:1px solid;}
.b-appr{color:var(--ok);border-color:var(--ok);} .b-cust{color:var(--warn);border-color:var(--warn);} .b-rej{color:var(--bad);border-color:var(--bad);} .b-over{color:#ff9f43;border-color:#ff9f43;} .b-rev{color:var(--muted);border-color:var(--muted);}
.opt{background:#211d36;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit;font-size:11.5px;cursor:pointer;}
.opt.on{border-color:var(--accent-2);color:#fff;background:#15263a;}
.opt.danger.on{border-color:var(--bad);background:#3a1616;color:#fff;}
#manifest{font-size:11px;color:var(--muted);margin-top:2px;}
#manifest .sig{color:var(--ok);}
@media (max-width:720px){#views{flex-direction:column;}#wire{position:static;transform:none;margin:4px auto;max-width:92%;}}
</style>
</head>
<body>
<script>
/* fail loud, never silent — surface any error instead of leaving a dead page */
function showFatal(e){var d=document.getElementById('__fatal');if(!d){d=document.createElement('div');d.id='__fatal';document.body.appendChild(d);}d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#2a0d16;color:#ff9ec7;border-top:1px solid #ff6b6b;padding:10px 14px;font:12px/1.5 monospace;white-space:pre-wrap';d.textContent='\u26a0 error: '+((e&&e.message)||e)+'  \u2014 page may be partly broken; send this line to Ryan';}
window.addEventListener('error',function(ev){showFatal(ev.error||ev.message);});
window.addEventListener('unhandledrejection',function(ev){showFatal(ev.reason);});
</script>
<div id="app">
  <div id="views">
    <div class="view self"><canvas id="cSelf"></canvas><div class="vlabel"><b>◐ YOU · self view</b><br><span class="mut" style="color:var(--muted)">wear anything — local only</span></div><div class="gatelog" id="logSelf"></div></div>
    <div id="wire"></div>
    <div class="view peer"><canvas id="cPeer"></canvas><div class="vlabel"><b>◑ PEER · their game</b><br><span style="color:var(--muted)">only approved renders</span></div><div class="gatelog" id="logPeer"></div></div>
  </div>
  <div id="ctl">
    <div class="rowlbl">Wardrobe — click to wear (any state)</div>
    <div class="chips" id="wardrobe"></div>
    <div class="rowlbl">Peer fallback policy (what others see for a blocked item)</div>
    <div class="chips" id="fallback"></div>
    <div class="rowlbl">Security model</div>
    <div class="chips">
      <button class="opt on" id="oTrust">peer: validate manifest ✓</button>
      <button class="opt danger" id="oHack">simulate hacked client</button>
    </div>
    <div class="rowlbl">Approved manifest (server-signed) — revoke is retroactive</div>
    <div class="chips" id="manifestChips"></div>
    <div id="manifest"></div>
  </div>
</div>

<div id="boot" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0a10;color:#9c97b8;z-index:50;">loading gate…</div>

<script>
(function(){
  function ls(urls,done){var i=0;(function n(){if(i>=urls.length){done(new Error('cdn'));return;}var s=document.createElement('script');s.src=urls[i++];s.onload=function(){done(null);};s.onerror=n;document.head.appendChild(s);})();}
  ls(['https://unpkg.com/three@0.147.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/0.147.0/three.min.js'],function(err){
    if(err||!window.THREE){document.getElementById('boot').textContent='Couldn\'t load Three.js.';return;}
    ls(['https://unpkg.com/three@0.147.0/examples/js/controls/OrbitControls.js','https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js'],function(){
      var b=document.getElementById('boot');if(b)b.remove();try{start();}catch(err){showFatal(err);}
    });
  });
})();

function start(){
"use strict";
if(typeof THREE.OrbitControls!=='function'){THREE.OrbitControls=function(c){this.target=new THREE.Vector3();this.update=function(){};};}
var P={ankleY:0.09,kneeY:0.52,hipY:0.96,waistY:1.07,chestY:1.27,shoulderY:1.44,neckY:1.50,headY:1.64,topY:1.74,legX:0.095,shoulderX:0.175,thighR:0.095,calfR:0.07,neckR:0.052,headR:0.10};
var SKIN=new THREE.MeshStandardMaterial({color:0xe8c4a8,roughness:0.6});
var HAIR=new THREE.MeshStandardMaterial({color:0x121016,roughness:0.55,metalness:0.05});
function S(m){m.castShadow=true;m.receiveShadow=true;return m;}
function lathe(pts,m,seg){return S(new THREE.Mesh(new THREE.LatheGeometry(pts.map(function(p){return new THREE.Vector2(p[0],p[1]);}),seg||28),m));}
function mat(c,f){f=f||'matte';if(f==='leather')return new THREE.MeshStandardMaterial({color:c,roughness:0.22,metalness:0.15,side:THREE.DoubleSide});if(f==='metal')return new THREE.MeshStandardMaterial({color:c,roughness:0.3,metalness:1});return new THREE.MeshStandardMaterial({color:c,roughness:0.8,side:THREE.DoubleSide});}

function buildMannequin(){
  var g=new THREE.Group();
  g.add(lathe([[0.155,P.hipY-0.04],[0.168,P.hipY+0.02],[0.150,P.hipY+0.07],[0.122,P.waistY],[0.135,P.waistY+0.08],[0.156,P.chestY-0.02],[0.150,P.chestY+0.05],[0.105,P.shoulderY-0.03],[0.070,P.neckY-0.02],[0.056,P.neckY+0.02]],SKIN,40));
  var pel=S(new THREE.Mesh(new THREE.SphereGeometry(0.155,26,18),SKIN));pel.position.set(0,P.hipY-0.05,0);pel.scale.set(1,0.7,0.85);g.add(pel);
  var neck=S(new THREE.Mesh(new THREE.CylinderGeometry(P.neckR,P.neckR+0.01,0.09,16),SKIN));neck.position.set(0,P.neckY+0.05,0);g.add(neck);
  var head=S(new THREE.Mesh(new THREE.SphereGeometry(P.headR,32,24),SKIN));head.position.set(0,P.headY,0);head.scale.set(0.92,1.08,0.95);g.add(head);
  var hb=S(new THREE.Mesh(new THREE.SphereGeometry(P.headR+0.02,24,18),HAIR));hb.position.set(0,P.headY+0.01,-0.01);hb.scale.set(1.05,1.18,1.05);g.add(hb);
  [-1,1].forEach(function(s){
    var up=S(new THREE.Mesh(new THREE.CapsuleGeometry(0.046,0.26,10,16),SKIN));up.position.set(s*(P.shoulderX+0.03),P.shoulderY-0.16,0);up.rotation.z=s*0.14;g.add(up);
    var fo=S(new THREE.Mesh(new THREE.CapsuleGeometry(0.038,0.24,10,16),SKIN));fo.position.set(s*(P.shoulderX+0.085),P.shoulderY-0.44,0);fo.rotation.z=s*0.1;g.add(fo);
    var th=S(new THREE.Mesh(new THREE.CapsuleGeometry(P.thighR,0.34,10,16),SKIN));th.position.set(s*P.legX,(P.hipY+P.kneeY)/2+0.02,0);g.add(th);
    var ca=S(new THREE.Mesh(new THREE.CapsuleGeometry(P.calfR,0.32,10,16),SKIN));ca.position.set(s*P.legX,(P.kneeY+P.ankleY)/2+0.02,0);g.add(ca);
  });
  return g;
}

/* ---- garment builders (procedural stand-ins for authored assets) ---- */
function G_corset(c){var g=new THREE.Group();g.add(lathe([[0.170,P.hipY],[0.150,P.hipY+0.06],[0.130,P.waistY],[0.142,P.waistY+0.08],[0.162,P.chestY-0.02],[0.150,P.chestY+0.05]],mat(c,'leather'),28));return g;}
function G_mesh(c){var g=new THREE.Group();var m=mat(c);m.transparent=true;m.opacity=0.6;g.add(lathe([[0.158,P.waistY-0.02],[0.135,P.waistY+0.04],[0.160,P.chestY],[0.118,P.shoulderY-0.03],[0.072,P.neckY]],m,28));return g;}
function G_bootleg(c){var g=new THREE.Group();g.add(lathe([[0.150,P.hipY+0.04],[0.140,P.waistY],[0.160,P.chestY],[0.115,P.shoulderY-0.03],[0.085,P.shoulderY+0.01]],mat(c),28));var logo=S(new THREE.Mesh(new THREE.PlaneGeometry(0.12,0.12),mat(0xf23030)));logo.position.set(0,P.chestY,0.161);g.add(logo);return g;}
function G_nsfw(c){var g=new THREE.Group();var m=mat(0xff2e88);g.add(lathe([[0.16,P.chestY-0.03],[0.15,P.chestY+0.04],[0.11,P.chestY+0.10]],m,20));return g;}
function G_skirt(c){var g=new THREE.Group();g.add(lathe([[0.150,P.hipY+0.01],[0.190,P.hipY-0.08],[0.208,P.hipY-0.18]],mat(c,'leather'),28));return g;}
function G_pants(c){var g=new THREE.Group();[-1,1].forEach(function(s){var t=S(new THREE.Mesh(new THREE.CylinderGeometry(P.calfR+0.03,P.thighR+0.03,P.hipY-P.ankleY,16,1,true),mat(c)));t.position.set(s*P.legX,(P.hipY+P.ankleY)/2,0);g.add(t);});return g;}
function G_choker(c){var g=new THREE.Group();var b=S(new THREE.Mesh(new THREE.TorusGeometry(P.neckR+0.01,0.012,10,26),mat(c,'leather')));b.rotation.x=Math.PI/2;b.position.y=P.neckY+0.04;b.scale.set(1,1,0.85);g.add(b);return g;}
function G_ears(c){var g=new THREE.Group();[-1,1].forEach(function(s){var e=S(new THREE.Mesh(new THREE.ConeGeometry(0.045,0.09,4),mat(c)));e.position.set(s*0.06,P.topY+0.02,-0.01);e.rotation.z=s*0.2;g.add(e);});return g;}
function G_crown(c){var g=new THREE.Group();var k=S(new THREE.Mesh(new THREE.TorusKnotGeometry(0.10,0.028,220,32),mat(0xffd35b,'metal')));k.position.y=P.topY+0.02;g.add(k);return g;}     // deliberately heavy
function F_generic(slot){var g=new THREE.Group();var c=0x5b5670;if(slot==='top')g.add(lathe([[0.150,P.waistY],[0.158,P.chestY],[0.11,P.shoulderY-0.03]],mat(c),20));else if(slot==='bottom')g.add(lathe([[0.15,P.hipY+0.01],[0.185,P.hipY-0.12]],mat(c),20));else if(slot==='neck'){var b=S(new THREE.Mesh(new THREE.TorusGeometry(P.neckR+0.01,0.01,8,20),mat(c)));b.rotation.x=Math.PI/2;b.position.y=P.neckY+0.04;g.add(b);}return g;}

/* ---- asset registry: each item carries moderation state + perf ---- */
var BUDGET=9000; // per-item triangle budget enforced at approval
var REG={
  corset :{name:'Lace Corset', slot:'top', state:'approved', tris:1900, build:G_corset, color:0x4a0e16},
  meshtop:{name:'Mesh Top', slot:'top', state:'approved', tris:1400, build:G_mesh, color:0x14131a},
  bootleg:{name:'Bootleg Band Tee', slot:'top', state:'custom', tris:1500, build:G_bootleg, color:0x14131a},
  nsfw   :{name:'“NSFW” Top', slot:'top', state:'rejected', tris:600, build:G_nsfw, color:0xff2e88},
  miniskt:{name:'Vinyl Mini', slot:'bottom', state:'approved', tris:1200, build:G_skirt, color:0x14131a},
  cpants :{name:'Custom Pants', slot:'bottom', state:'custom', tris:1600, build:G_pants, color:0x223055},
  choker :{name:'Spiked Choker', slot:'neck', state:'approved', tris:900, build:G_choker, color:0x14131a},
  ears   :{name:'Cat Ears', slot:'head', state:'approved', tris:200, build:G_ears, color:0x2a1430},
  crown  :{name:'God-Crown', slot:'head', state:'overbudget', tris:51000, build:G_crown, color:0xffd35b}
};
var SLOTS=['top','bottom','neck','head'];

/* ---- gate state ---- */
var revoked={};                 // ids pulled from the manifest (retroactive)
var fallbackPolicy='generic';   // 'generic' | 'hide'
var trustModel='validate';      // 'validate' (correct) | 'trust' (naive/insecure)
var hacked=false;               // hacked client claims everything is approved
var equip={};                   // slot -> id  (this is ALL that crosses the wire)

// server-authoritative manifest: only items whose state is 'approved' and not revoked
function manifestIds(){return Object.keys(REG).filter(function(id){return REG[id].state==='approved' && !revoked[id];});}
function inManifest(id){return REG[id] && REG[id].state==='approved' && !revoked[id];}
// tiny illustrative "signature" over the approved set (NOT real crypto — shows integrity/turnover)
function sig(){var s=manifestIds().sort().join(',');var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(16);}

// the decision a PEER makes for one equipped id
function peerDecision(id){
  if(!id) return {allow:false,reason:'empty'};
  if(trustModel==='trust'){ // naive: believe the client's word
    if(hacked) return {allow:true,reason:'client-claimed (INSECURE)'};
    return inManifest(id)?{allow:true,reason:'approved'}:{allow:false,reason:'client says no'};
  }
  // correct: validate against the signed manifest, ignore client claims
  if(inManifest(id)) return {allow:true,reason:'approved'};
  var st=REG[id]?REG[id].state:'unknown';
  if(revoked[id]) return {allow:false,reason:'revoked'};
  if(st==='overbudget') return {allow:false,reason:'over perf budget ('+REG[id].tris.toLocaleString()+' > '+BUDGET.toLocaleString()+')'};
  if(st==='rejected') return {allow:false,reason:'rejected by moderation'};
  if(st==='custom') return {allow:false,reason:'unapproved custom asset'};
  return {allow:false,reason:'not in manifest'};
}

/* ---- two independent scenes (self + peer) ---- */
function makeStage(canvasId){
  var canvas=document.getElementById(canvasId);
  var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.physicallyCorrectLights=true;renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  var scene=new THREE.Scene();scene.background=new THREE.Color(0x0b0a10);scene.fog=new THREE.Fog(0x0b0a10,3.5,9);
  var camera=new THREE.PerspectiveCamera(40,1,0.1,100);camera.position.set(0.3,1.15,2.7);
  var controls=new THREE.OrbitControls(camera,canvas);controls.target.set(0,1.05,0);controls.enableDamping=true;controls.minDistance=1.3;controls.maxDistance=5;controls.maxPolarAngle=Math.PI*0.9;
  scene.add(new THREE.HemisphereLight(0xbfb9e0,0x16121f,0.8));
  var key=new THREE.SpotLight(0xffffff,70,20,Math.PI/5,0.4,1.5);key.position.set(2.5,4.5,3.2);key.castShadow=true;key.shadow.mapSize.set(1024,1024);key.shadow.bias=-0.0004;scene.add(key,key.target);
  scene.add(Object.assign(new THREE.PointLight(0xff2e88,32,12,2),{position:new THREE.Vector3(-2.4,1.6,-1.3)}));
  scene.add(Object.assign(new THREE.PointLight(0x21d4fd,28,12,2),{position:new THREE.Vector3(2.4,1.5,-1.7)}));
  var floor=new THREE.Mesh(new THREE.CircleGeometry(3,48),new THREE.MeshStandardMaterial({color:0x111018,roughness:0.4,metalness:0.5}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
  var figure=buildMannequin();scene.add(figure);
  var worn={};                  // slot -> mounted Group
  return {canvas:canvas,renderer:renderer,scene:scene,camera:camera,controls:controls,figure:figure,worn:worn};
}
var self_=makeStage('cSelf'), peer=makeStage('cPeer');

function clearWorn(stage){for(var s in stage.worn){if(stage.worn[s]){stage.figure.remove(stage.worn[s]);disposeTree(stage.worn[s]);}}stage.worn={};}
function disposeTree(o){o.traverse(function(n){if(n.geometry)n.geometry.dispose();if(n.material){(Array.isArray(n.material)?n.material:[n.material]).forEach(function(m){m.dispose();});}});}

function rebuild(){
  // SELF: render whatever is equipped, any state (you can wear anything locally)
  clearWorn(self_); var selfLog=[];
  SLOTS.forEach(function(slot){var id=equip[slot];if(!id)return;var it=REG[id];var grp=it.build(it.color);self_.worn[slot]=grp;self_.figure.add(grp);
    selfLog.push('<span class="ok">▪</span> '+it.name+' <span class="mut">('+slot+')</span>');});
  document.getElementById('logSelf').innerHTML=selfLog.join('<br>')||'<span class="mut">nothing worn</span>';

  // PEER: resolve each id through the gate
  clearWorn(peer); var peerLog=[];
  SLOTS.forEach(function(slot){var id=equip[slot];if(!id)return;var it=REG[id];var d=peerDecision(id);
    if(d.allow){var grp=it.build(it.color);peer.worn[slot]=grp;peer.figure.add(grp);peerLog.push('<span class="ok">✓</span> '+it.name+' <span class="mut">rendered ('+d.reason+')</span>');}
    else{if(fallbackPolicy==='generic'){var f=F_generic(slot);peer.worn[slot]=f;peer.figure.add(f);}
      peerLog.push('<span class="bad">✗</span> '+it.name+' <span class="warn">blocked: '+d.reason+'</span> <span class="mut">→ '+(fallbackPolicy==='generic'?'generic fallback':'hidden')+'</span>');}
  });
  document.getElementById('logPeer').innerHTML=peerLog.join('<br>')||'<span class="mut">nothing worn</span>';
  document.getElementById('wire').innerHTML='⟶ crosses the wire: <b>'+JSON.stringify(equip)+'</b><br><span style="color:var(--muted)">IDs only — never asset bytes. Peer resolves them locally.</span>';
  refreshUI();
}

/* ---- UI ---- */
function badge(st){return st==='approved'?'<span class="badge b-appr">approved</span>':st==='custom'?'<span class="badge b-cust">custom</span>':st==='rejected'?'<span class="badge b-rej">rejected</span>':st==='overbudget'?'<span class="badge b-over">over-budget</span>':'';}
function buildWardrobe(){
  var w=document.getElementById('wardrobe');w.innerHTML='';
  Object.keys(REG).forEach(function(id){var it=REG[id];var b=document.createElement('button');b.className='chip';b.dataset.id=id;
    b.innerHTML=it.name+' '+badge(revoked[id]?'':it.state)+(revoked[id]?'<span class="badge b-rev">revoked</span>':'');
    b.onclick=function(){equip[it.slot]=(equip[it.slot]===id)?null:id;rebuild();};w.appendChild(b);});
}
function buildFallback(){var f=document.getElementById('fallback');f.innerHTML='';[['generic','generic garment'],['hide','hide item']].forEach(function(o){var b=document.createElement('button');b.className='chip'+(fallbackPolicy===o[0]?' on':'');b.textContent=o[1];b.onclick=function(){fallbackPolicy=o[0];rebuild();};f.appendChild(b);});}
function buildManifestChips(){var m=document.getElementById('manifestChips');m.innerHTML='';Object.keys(REG).filter(function(id){return REG[id].state==='approved';}).forEach(function(id){var b=document.createElement('button');b.className='chip'+(revoked[id]?'':' on');b.innerHTML=(revoked[id]?'⟲ restore ':'⊘ revoke ')+REG[id].name;b.onclick=function(){revoked[id]=!revoked[id];rebuild();};m.appendChild(b);});}
function refreshUI(){
  [].forEach.call(document.querySelectorAll('#wardrobe .chip'),function(b){b.classList.toggle('on',equip[REG[b.dataset.id].slot]===b.dataset.id);
    b.innerHTML=REG[b.dataset.id].name+' '+badge(revoked[b.dataset.id]?'':REG[b.dataset.id].state)+(revoked[b.dataset.id]?'<span class="badge b-rev">revoked</span>':'');});
  buildManifestChips();
  document.getElementById('manifest').innerHTML='approved: <b>'+manifestIds().length+'</b>/'+Object.keys(REG).length+' · <span class="sig">manifest sig '+sig()+'</span> <span class="mut">(illustrative)</span> · budget '+BUDGET.toLocaleString()+' tris/item';
  document.getElementById('oTrust').textContent=trustModel==='validate'?'peer: validate manifest ✓':'peer: trust client ✗ (insecure)';
  document.getElementById('oTrust').classList.toggle('on',trustModel==='validate');
  document.getElementById('oHack').classList.toggle('on',hacked);
}
document.getElementById('oTrust').onclick=function(){trustModel=(trustModel==='validate')?'trust':'validate';rebuild();};
document.getElementById('oHack').onclick=function(){hacked=!hacked;rebuild();};

buildWardrobe();buildFallback();
equip.top='corset';equip.bottom='miniskt';equip.neck='choker';
rebuild();

/* ---- render both stages ---- */
var clock=new THREE.Clock();
function resize(st){var w=st.canvas.clientWidth,h=st.canvas.clientHeight;if(w&&h&&(st.canvas.width!==w||st.canvas.height!==h)){st.renderer.setSize(w,h,false);st.camera.aspect=w/h;st.camera.updateProjectionMatrix();}}
function tick(){requestAnimationFrame(tick);var dt=clock.getDelta();[self_,peer].forEach(function(st){st.figure.rotation.y+=dt*0.3;resize(st);st.controls.update();st.renderer.render(st.scene,st.camera);});}
tick();
}
</script>
