[package]
name = "corpus"
version = "0.1.0"
edition = "2021"
description = "Chain-of-custody corpus cataloger: one-pass scan of many drives → SHA-256 catalog with duplicate detection, completeness (broken/truncated) checks, high-signal flagging, and lane hints (case/patient/art). Read-only; the catalog is the source of truth the dedup + viewer + semantic search all read from."

[[bin]]
name = "corpus"
path = "src/main.rs"

[dependencies]
rusqlite   = { version = "0.32", features = ["bundled"] }  # embedded catalog, no external db
sha2       = "0.10"                                          # content identity for CoC + dedup
walkdir    = "2"
rayon      = "1"                                             # parallel hashing across a big corpus
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto       = "thin"
strip     = true
