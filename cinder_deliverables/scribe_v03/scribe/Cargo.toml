[package]
name = "scribe"
version = "0.3.0"
edition = "2021"
description = "Disk scan + heatmap + select-to-backup TUI with a pluggable simulation hook (v0.3: visual sim-result rendering, executor watchdog, sub-cell heatmap)"

[dependencies]
ratatui   = "0.28"
crossterm = "0.28"
walkdir   = "2"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto       = "thin"
strip     = true
